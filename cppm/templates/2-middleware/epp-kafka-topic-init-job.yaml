apiVersion: batch/v1
kind: Job
metadata:
  name: epp-kafka-topic-init
  namespace: {{ .Release.Namespace }}
spec:
  backoffLimit: 5
  template:
    metadata:
      name: epp-kafka-topic-init
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-for-kafka
          image: "{{ .Values.global.imageRegistry }}/cpp-platform:{{ .Values.global.imageTag }}"
          command:
            - "/bin/bash"
            - "-c"
            - |
              echo "Waiting for Kafka broker (epp-kafka:9092) to be ready..."
              until true || timeout 1 bash -c "</dev/tcp/epp-kafka/9092" 2>/dev/null; do
                echo "Kafka is not ready yet. Retrying in 5 seconds..."
                sleep 5
              done
              echo "Kafka is up and running! Proceeding to topic initialization."
      containers:
        - name: kafka-topic-init
          image: "{{ .Values.global.imageRegistry }}/cpp-platform:{{ .Values.global.imageTag }}"
          securityContext:
            runAsUser: 2500
          env:
            - name: KAFKA_PARTITION_COUNT
              value: "1"
            - name: VOLUME_ROOT
              value: "/permanent"
          command:
            - "/bin/bash"
            - "-c"
            - |
              echo "==== Starting AhnLab Kafka Topic Initialization ===="
              KAFKA_DIR="/opt/ahnlab/cpp/service/kafka"
              if [ -f "$KAFKA_DIR/bin/init.sh" ]; then
                echo "Running Kafka init.sh..."
                bash $KAFKA_DIR/bin/init.sh
              fi
              if [ -f "$KAFKA_DIR/bin/setup.sh" ]; then
                echo "Running Kafka setup.sh..."
                bash $KAFKA_DIR/bin/setup.sh
              fi
              echo "==== Kafka Topic Initialization Completed Successfully ===="
          volumeMounts:
            {{- include "cppm.commonVolumeMounts" . | nindent 12 }}
      volumes:
        {{- include "cppm.commonVolumes" . | nindent 8 }}
