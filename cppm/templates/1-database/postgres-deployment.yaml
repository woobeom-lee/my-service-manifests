apiVersion: apps/v1
kind: Deployment
metadata:
  name: epp-postgres-eppoltp
  namespace: {{ .Release.Namespace }}
  labels:
    app: epp-postgres-eppoltp
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: epp-postgres-eppoltp
  template:
    metadata:
      labels:
        app: epp-postgres-eppoltp
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      hostname: cpp-postgres-eppoltp
      securityContext:
        runAsUser: 2500
        runAsGroup: 2500
      nodeSelector:
        kubernetes.io/hostname: {{ .Values.global.nodeName | quote }}
      tolerations:
        - operator: "Exists"
          effect: "NoSchedule"
      initContainers:
        - name: init-link
          image: "{{ .Values.global.imageRegistry }}/cpp-platform:{{ .Values.global.imageTag }}"
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsUser: 0
            privileged: true
          command:
            - "/bin/bash"
            - "-c"
            - |
              bash /opt/ahnlab/cpp/bin/setting/install_link.sh || true
              chown -R 2500:2500 /opt/ahnlab /permanent /nosql /database /tmp /var/log /home /opt/repo /new /var/run/postgresql || true
              if [ -S /var/run/docker.sock ]; then chmod 666 /var/run/docker.sock; fi
          volumeMounts:
            - name: vol-docker-sock
              mountPath: /var/run/docker.sock
            - name: vol-tools
              mountPath: /tools
            {{- include "cppm.commonVolumeMounts" . | nindent 12 }}
      containers:
        - name: epp-postgres-eppoltp
          image: "{{ .Values.global.imageRegistry }}/cpp-platform:{{ .Values.global.imageTag }}"
          imagePullPolicy: IfNotPresent
          command: ["/bin/bash", "/opt/ahnlab/cpp/cmd/epp-postgres-eppoltp.sh"]
          securityContext:
            privileged: true
          ports:
            - containerPort: 8817
          # 🔥 K8s Native 방화벽 영구 개방 로직
          # 파드가 기동될 때마다 자동으로 실행되어 pg_hba.conf를 찾고 통과 룰을 찔러 넣습니다.
          lifecycle:
            postStart:
              exec:
                command:
                  - "/bin/bash"
                  - "-c"
                  - |
                    (
                      for i in {1..30}; do
                        HBA_FILE=$(find /permanent /opt -name "pg_hba.conf" 2>/dev/null | grep -E "postgres|eppoltp" | head -n 1)
                        if [ -n "$HBA_FILE" ]; then
                          if ! grep -q "0.0.0.0/0.*trust" "$HBA_FILE"; then
                            echo "host    all             all             0.0.0.0/0               md5" >> "$HBA_FILE"
                            echo "host    all             all             0.0.0.0/0               trust" >> "$HBA_FILE"
                            # Postgres 백그라운드 실시간 리로드 (재시작 불필요)
                            kill -HUP 1 || true
                          fi
                          break
                        fi
                        sleep 2
                      done
                    ) &
          env:
            - name: REDIS_PASSWORD
              value: "qwe123"
            - name: TZ
              value: "Asia/Seoul"
            - name: CONTAINER_NAME
              value: "cpp-postgres-eppoltp"
          volumeMounts:
            - name: vol-docker-sock
              mountPath: /var/run/docker.sock
            {{- include "cppm.commonVolumeMounts" . | nindent 12 }}
      volumes:
        - name: vol-docker-sock
          hostPath:
            path: /var/run/docker.sock
            type: Socket
        - name: vol-tools
          hostPath:
            path: /home/registry/my-service-manifests/cppm/tools
            type: Directory
        {{- include "cppm.commonVolumes" . | nindent 8 }}
---
apiVersion: v1
kind: Service
metadata:
  name: epp-postgres-eppoltp
  namespace: {{ .Release.Namespace }}
spec:
  type: ClusterIP
  selector:
    app: epp-postgres-eppoltp
  ports:
    - port: 8817
      targetPort: 8817
