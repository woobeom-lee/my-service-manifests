apiVersion: apps/v1
kind: Deployment
metadata:
  name: epp-postgres-eppoltp
  namespace: {{ .Release.Namespace }}
  labels:
    app: epp-postgres-eppoltp
spec:
  replicas: {{ .Values.database.postgres.replicas }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: epp-postgres-eppoltp
  template:
    metadata:
      labels:
        app: epp-postgres-eppoltp
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      nodeSelector:
        kubernetes.io/hostname: {{ .Values.global.nodeName | quote }}
      tolerations:
        - operator: "Exists"
          effect: "NoSchedule"
      initContainers:
        # [단계 1] 문 열기: root(0)로 실행되지만 NFS에서는 2500으로 취급됨.
        # 2500번이 소유자이므로 chmod 777로 문을 열 수 있음.
        - name: open-permissions
          image: "{{ .Values.global.imageRegistry }}/cpp-platform:{{ .Values.global.imageTag }}"
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsUser: 0
            privileged: true
          command:
            - "/bin/bash"
            - "-c"
            - |
              chmod 777 /database
              chmod 777 /var/run/postgresql
          volumeMounts:
            - name: vol-database
              mountPath: /database
            - name: vol-var-postgres
              mountPath: /var/run/postgresql
 
        # [단계 2] 집 짓기: 실제 26번(postgres)으로 실행.
        # 문이 열려있으므로 방해 없이 자신의 폴더를 26:26으로 구축함.
        - name: init-postgres-data
          image: "{{ .Values.global.imageRegistry }}/cpp-platform:{{ .Values.global.imageTag }}"
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsUser: 26
            privileged: true
          command:
            - "/bin/bash"
            - "-c"
            - |
              # 26번으로 생성되므로 NFS 방어를 뚫고 완벽히 26:26으로 저장됨
              mkdir -p /database/15/cppoltpdata
              chmod 700 /database/15/cppoltpdata
              chmod -R 755 /database/cmd || true
              # DB 파일 증발 시 자동 복구(initdb)도 26번 권한으로 완벽하게 수행
              if [ ! -f /database/15/cppoltpdata/postgresql.conf ]; then
                echo "DB files are missing. Running initdb as UID 26..."
                /usr/pgsql-15/bin/initdb -D /database/15/cppoltpdata
                echo "listen_addresses = '*'" >> /database/15/cppoltpdata/postgresql.conf
                echo "port = 8817" >> /database/15/cppoltpdata/postgresql.conf
                echo "host all all 0.0.0.0/0 trust" >> /database/15/cppoltpdata/pg_hba.conf
              fi
          volumeMounts:
            - name: vol-database
              mountPath: /database
            - name: vol-var-postgres
              mountPath: /var/run/postgresql
      containers:
        - name: postgres
          image: "{{ .Values.global.imageRegistry }}/cpp-platform:{{ .Values.global.imageTag }}"
          imagePullPolicy: IfNotPresent
          command: ["/bin/bash", "/database/cmd/epp-postgres-eppoltp.sh"]
          securityContext:
            privileged: true
            runAsUser: 26
          ports:
            - containerPort: 8817
          env:
            - name: TZ
              value: "Asia/Seoul"
            - name: REDIS_PASSWORD
              value: "qwe123"
          lifecycle:
            postStart:
              exec:
                command:
                  - "/bin/bash"
                  - "-c"
                  - |
                    (
                      # 1. 방화벽 강제 개방 로직
                      for i in {1..30}; do
                        HBA_FILE=$(find /database -name "pg_hba.conf" 2>/dev/null | grep -E "postgres|eppoltp" | head -n 1)
                        if [ -n "$HBA_FILE" ]; then
                          if ! grep -q "0.0.0.0/0.*trust" "$HBA_FILE"; then
                            echo "host    all             all             0.0.0.0/0               trust" >> "$HBA_FILE"
                            psql -h 127.0.0.1 -p 8817 -U postgres -c "SELECT pg_reload_conf();" || true
                          fi
                          break
                        fi
                        sleep 2
                      done
                      # 2. 안랩 원본 라이선스 패치 로직
                      for i in {1..30}; do
                        if psql -h 127.0.0.1 -p 8817 -U postgres -d postgres -c "SELECT 1;" > /dev/null 2>&1; then
                          echo "Database is ready. Executing license bypass queries..."
                          psql -h 127.0.0.1 -p 8817 -U postgres -d cppoltp -c "UPDATE tb_product_license SET expire_update_status = 'FINISH' WHERE expire_update_status = 'UPDATING';"
                          psql -h 127.0.0.1 -p 8817 -U postgres -d cppoltp -c "UPDATE tb_multi_license SET expire_update_status = 'FINISH' WHERE expire_update_status = 'UPDATING';"
                          break
                        fi
                        sleep 2
                      done
                    ) &
          volumeMounts:
            - name: vol-database
              mountPath: /database
            - name: vol-var-postgres
              mountPath: /var/run/postgresql
      volumes:
        - name: vol-database
          hostPath:
            path: {{ .Values.global.ahnfsBasePath }}/database
            type: DirectoryOrCreate
        - name: vol-var-postgres
          hostPath:
            path: {{ .Values.global.ahnfsBasePath }}/var/run/postgresql
            type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: epp-postgres-eppoltp
  namespace: {{ .Release.Namespace }}
spec:
  type: ClusterIP
  selector:
    app: epp-postgres-eppoltp
  ports:
    - port: 8817
      targetPort: 8817
