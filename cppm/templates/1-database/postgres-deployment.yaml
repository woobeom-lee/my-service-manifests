apiVersion: apps/v1
kind: Deployment
metadata:
  name: epp-postgres-eppoltp
  namespace: {{ .Release.Namespace }}
  labels:
    app: epp-postgres-eppoltp
spec:
  replicas: {{ .Values.database.postgres.replicas }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: epp-postgres-eppoltp
  template:
    metadata:
      labels:
        app: epp-postgres-eppoltp
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      hostname: cpp-postgres-eppoltp
      nodeSelector:
        kubernetes.io/hostname: {{ .Values.global.nodeName | quote }}
      tolerations:
        - operator: "Exists"
          effect: "NoSchedule"
      initContainers:
        - name: init-postgres-data
          image: "{{ .Values.global.imageRegistry }}/cpp-platform:{{ .Values.global.imageTag }}"
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsUser: 0
            privileged: true
          command:
            - "/bin/bash"
            - "-c"
            - |
              if [ ! -f /database/cmd/epp-postgres-eppoltp.sh ]; then
                bash /opt/ahnlab/cpp/bin/setting/install_link.sh || true
              fi
              mkdir -p /database/15/cppoltpdata /var/run/postgresql
              chown -R 26:26 /database /var/run/postgresql
              chmod 700 /database/15/cppoltpdata
 
              if [ ! -f /database/15/cppoltpdata/postgresql.conf ]; then
                su - postgres -c "/usr/pgsql-15/bin/initdb -D /database/15/cppoltpdata"
                echo "listen_addresses = '*'" >> /database/15/cppoltpdata/postgresql.conf
                echo "port = 8817" >> /database/15/cppoltpdata/postgresql.conf
              fi
 
              if [ -f /database/15/cppoltpdata/pg_hba.conf ]; then
                sed -i '/EOF/d' /database/15/cppoltpdata/pg_hba.conf
                if ! grep -q "0.0.0.0/0.*trust" /database/15/cppoltpdata/pg_hba.conf; then
                  echo "" >> /database/15/cppoltpdata/pg_hba.conf
                  echo "host all all 127.0.0.1/32 trust" >> /database/15/cppoltpdata/pg_hba.conf
                  echo "host all all {{ .Values.global.masterIp }}/32 trust" >> /database/15/cppoltpdata/pg_hba.conf
                  echo "host all all 10.244.0.0/16 trust" >> /database/15/cppoltpdata/pg_hba.conf
                  echo "host all all 0.0.0.0/0 trust" >> /database/15/cppoltpdata/pg_hba.conf
                fi
              fi
 
              chown -R 26:26 /database /var/run/postgresql
              chmod 700 /database/15/cppoltpdata
              rm -f /var/run/postgresql/.s.PGSQL* /tmp/.s.PGSQL* || true
          volumeMounts:
            - name: vol-database
              mountPath: /database
            - name: vol-var-postgres
              mountPath: /var/run/postgresql
      containers:
        - name: postgres
          image: "{{ .Values.global.imageRegistry }}/cpp-platform:{{ .Values.global.imageTag }}"
          imagePullPolicy: IfNotPresent
          command: ["/bin/bash", "/database/cmd/epp-postgres-eppoltp.sh"]
          securityContext:
            privileged: true
            runAsUser: 26
          ports:
            - containerPort: 8817
          env:
            - name: TZ
              value: "Asia/Seoul"
            - name: REDIS_PASSWORD
              value: "qwe123"
          lifecycle:
            postStart:
              exec:
                command:
                  - "/bin/bash"
                  - "-c"
                  - |
                    nohup bash -c '
                      for i in {1..30}; do
                        if psql -h 127.0.0.1 -p 8817 -U postgres -d postgres -c "SELECT 1;" > /dev/null 2>&1; then
                          psql -h 127.0.0.1 -p 8817 -U postgres -d postgres -c "ALTER USER eppoltpuser WITH SUPERUSER PASSWORD '\''qweQWE123!@#'\'';" > /dev/null 2>&1 || \
                          psql -h 127.0.0.1 -p 8817 -U postgres -d postgres -c "CREATE ROLE eppoltpuser WITH LOGIN SUPERUSER PASSWORD '\''qweQWE123!@#'\'';" > /dev/null 2>&1 || true
                          break
                        fi
                        sleep 2
                      done
                      while true; do
                        psql -h 127.0.0.1 -p 8817 -U postgres -d cppoltp -c "
                          UPDATE tb_config SET value = '\''FINISH'\'' WHERE config_group = '\''SYS_LICENSE'\'' AND (key = '\''apply_license_response'\'' OR value = '\''UPDATING'\'') AND value != '\''FINISH'\'';
                          UPDATE tb_product_license SET expire_update_status = '\''DONE'\'' WHERE expire_update_status = '\''UPDATING'\'';
                          UPDATE tb_multi_license SET expire_update_status = '\''DONE'\'' WHERE expire_update_status = '\''UPDATING'\'';
                        " > /dev/null 2>&1 || true
                        sleep 5
                      done
                    ' >/dev/null 2>&1 &
          volumeMounts:
            - name: vol-database
              mountPath: /database
            - name: vol-var-postgres
              mountPath: /var/run/postgresql
      volumes:
        - name: vol-database
          hostPath:
            path: {{ .Values.global.ahnfsBasePath }}/database
            type: DirectoryOrCreate
        - name: vol-var-postgres
          hostPath:
            path: {{ .Values.global.ahnfsBasePath }}/var/run/postgresql
            type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: epp-postgres-eppoltp
  namespace: {{ .Release.Namespace }}
spec:
  type: ClusterIP
  selector:
    app: epp-postgres-eppoltp
  ports:
    - port: 8817
      targetPort: 8817
