apiVersion: apps/v1
kind: Deployment
metadata:
  name: epp-postgres-eppoltp
  namespace: {{ .Release.Namespace }}
  labels:
    app: epp-postgres-eppoltp
spec:
  replicas: {{ .Values.database.postgres.replicas }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: epp-postgres-eppoltp
  template:
    metadata:
      labels:
        app: epp-postgres-eppoltp
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      nodeSelector:
        kubernetes.io/hostname: {{ .Values.global.nodeName | quote }}
      tolerations:
        - operator: "Exists"
          effect: "NoSchedule"
      initContainers:
        # [단계 1] NFS 강제 UID(2500) 권한을 이용해 하위 폴더까지 모든 문을 개방(-R)
        - name: open-permissions
          image: "{{ .Values.global.imageRegistry }}/cpp-platform:{{ .Values.global.imageTag }}"
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsUser: 0
            privileged: true
          command:
            - "/bin/bash"
            - "-c"
            - |
              # 이번엔 -R 옵션으로 가장 깊은 DB 파일까지 모두 엽니다!
              chmod -R 777 /database || true
              chmod -R 777 /var/run/postgresql || true
          volumeMounts:
            - name: vol-database
              mountPath: /database
            - name: vol-var-postgres
              mountPath: /var/run/postgresql
 
        # [단계 2] Postgres(26) 계정으로 진입하여 파일을 복제, 26:26 소유권 창조!
        - name: init-postgres-data
          image: "{{ .Values.global.imageRegistry }}/cpp-platform:{{ .Values.global.imageTag }}"
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsUser: 26  # 반드시 26번으로 실행!
            privileged: true
          command:
            - "/bin/bash"
            - "-c"
            - |
              # 1. 2500번 껍데기를 26번으로 완벽하게 탈바꿈시키는 복제 로직
              if [ -d "/database/15/cppoltpdata" ]; then
                OWNER=$(stat -c '%u' /database/15/cppoltpdata 2>/dev/null)
                if [ "$OWNER" != "26" ]; then
                  echo "Found UID $OWNER. Cloning data to force UID 26..."
                  cd /database
                  cp -R 15 15_postgres
                  rm -rf 15
                  mv 15_postgres 15
                fi
              else
                mkdir -p /database/15/cppoltpdata
              fi
              # 2. 파일 증발 시 자동 복구 로직 (보험)
              if [ ! -f /database/15/cppoltpdata/postgresql.conf ]; then
                /usr/pgsql-15/bin/initdb -D /database/15/cppoltpdata
                echo "listen_addresses = '*'" >> /database/15/cppoltpdata/postgresql.conf
                echo "port = 8817" >> /database/15/cppoltpdata/postgresql.conf
                echo "host all all 0.0.0.0/0 trust" >> /database/15/cppoltpdata/pg_hba.conf
              fi
              # 3. Postgres 보안 규정 준수 (700) 및 잔여 락 파일 청소
              chmod 700 /database/15/cppoltpdata
              chmod -R 755 /database/cmd || true
              rm -f /var/run/postgresql/.s.PGSQL* || true
          volumeMounts:
            - name: vol-database
              mountPath: /database
            - name: vol-var-postgres
              mountPath: /var/run/postgresql
      containers:
        - name: postgres
          image: "{{ .Values.global.imageRegistry }}/cpp-platform:{{ .Values.global.imageTag }}"
          imagePullPolicy: IfNotPresent
          command: ["/bin/bash", "/database/cmd/epp-postgres-eppoltp.sh"]
          securityContext:
            privileged: true
            runAsUser: 26
          ports:
            - containerPort: 8817
          env:
            - name: TZ
              value: "Asia/Seoul"
            - name: REDIS_PASSWORD
              value: "qwe123"
          lifecycle:
            postStart:
              exec:
                command:
                  - "/bin/bash"
                  - "-c"
                  - |
                    (
                      # 1. 방화벽 강제 개방 로직
                      for i in {1..30}; do
                        HBA_FILE=$(find /database -name "pg_hba.conf" 2>/dev/null | grep -E "postgres|eppoltp" | head -n 1)
                        if [ -n "$HBA_FILE" ]; then
                          if ! grep -q "0.0.0.0/0.*trust" "$HBA_FILE"; then
                            echo "host    all             all             0.0.0.0/0               trust" >> "$HBA_FILE"
                            psql -h 127.0.0.1 -p 8817 -U postgres -c "SELECT pg_reload_conf();" || true
                          fi
                          break
                        fi
                        sleep 2
                      done
                      # 2. 안랩 원본 라이선스 패치 로직
                      for i in {1..30}; do
                        if psql -h 127.0.0.1 -p 8817 -U postgres -d postgres -c "SELECT 1;" > /dev/null 2>&1; then
                          echo "Database is ready. Executing license bypass queries..."
                          psql -h 127.0.0.1 -p 8817 -U postgres -d cppoltp -c "UPDATE tb_product_license SET expire_update_status = 'FINISH' WHERE expire_update_status = 'UPDATING';"
                          psql -h 127.0.0.1 -p 8817 -U postgres -d cppoltp -c "UPDATE tb_multi_license SET expire_update_status = 'FINISH' WHERE expire_update_status = 'UPDATING';"
                          break
                        fi
                        sleep 2
                      done
                    ) &
          volumeMounts:
            - name: vol-database
              mountPath: /database
            - name: vol-var-postgres
              mountPath: /var/run/postgresql
      volumes:
        - name: vol-database
          hostPath:
            path: {{ .Values.global.ahnfsBasePath }}/database
            type: DirectoryOrCreate
        - name: vol-var-postgres
          hostPath:
            path: {{ .Values.global.ahnfsBasePath }}/var/run/postgresql
            type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: epp-postgres-eppoltp
  namespace: {{ .Release.Namespace }}
spec:
  type: ClusterIP
  selector:
    app: epp-postgres-eppoltp
  ports:
    - port: 8817
      targetPort: 8817
