apiVersion: apps/v1
kind: Deployment
metadata:
  name: epp-mongo-shardsvr3
  namespace: {{ .Release.Namespace }}
  labels:
    app: epp-mongo-shardsvr3
spec:
  replicas: {{ .Values.database.mongo.shardsvr3.replicas }}
  selector:
    matchLabels:
      app: epp-mongo-shardsvr3
  template:
    metadata:
      labels:
        app: epp-mongo-shardsvr3
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      nodeSelector:
        kubernetes.io/hostname: {{ .Values.global.nodeName | quote }}
      hostAliases:
        - ip: {{ .Values.global.masterIp | quote }}
          hostnames: []
      # 🚀 [추가됨] 3번용 구동 스크립트를 원본(1번)으로부터 스스로 복제
      initContainers:
        - name: init-shard-script
          image: "{{ .Values.global.imageRegistry }}/cpp-platform:{{ .Values.global.imageTag }}"
          securityContext:
            runAsUser: 0
          command:
            - "/bin/bash"
            - "-c"
            - |
              echo "Replicating Mongo Shardsvr scripts for Shard 3..."
              cp /nosql/cmd/epp-mongo-shardsvr.sh /nosql/cmd/epp-mongo-shardsvr3.sh || true
              cp /nosql/conf/epp-mongo-shardsvr.conf /nosql/conf/epp-mongo-shardsvr3.conf || true
              chown 2500:2500 /nosql/cmd/epp-mongo-shardsvr3.sh /nosql/conf/epp-mongo-shardsvr3.conf || true
              chmod +x /nosql/cmd/epp-mongo-shardsvr3.sh || true
          volumeMounts:
            - name: vol-nosql
              mountPath: /nosql
 
      containers:
        - name: epp-mongo-shardsvr3
          image: "{{ .Values.global.imageRegistry }}/cpp-platform:{{ .Values.global.imageTag }}"
          imagePullPolicy: IfNotPresent
          command: ["/bin/bash", "/nosql/cmd/epp-mongo-shardsvr3.sh"]
          securityContext:
            runAsUser: 2500
          env:
            - name: TZ
              value: "Asia/Seoul"
          volumeMounts:
            - name: vol-nosql
              mountPath: /nosql
            - name: vol-tmp
              mountPath: /tmp
      volumes:
        - name: vol-nosql
          hostPath:
            path: {{ .Values.global.ahnfsBasePath }}/nosql
            type: DirectoryOrCreate
        - name: vol-tmp
          hostPath:
            path: {{ .Values.global.ahnfsBasePath }}/tmp
            type: DirectoryOrCreate
