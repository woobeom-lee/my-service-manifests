apiVersion: apps/v1
kind: Deployment
metadata:
  name: epp-mongo-mongos
  namespace: {{ .Release.Namespace }}
  labels:
    app: epp-mongo-mongos
spec:
  replicas: {{ .Values.database.mongo.mongos.replicas }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: epp-mongo-mongos
  template:
    metadata:
      labels:
        app: epp-mongo-mongos
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      hostname: cpp-mongo-mongos
      securityContext:
        runAsUser: 2500
        runAsGroup: 2500
      nodeSelector:
        kubernetes.io/hostname: {{ .Values.global.nodeName | quote }}
      tolerations:
        - operator: "Exists"
          effect: "NoSchedule"
      hostAliases:
        - ip: {{ .Values.global.masterIp | quote }}
          hostnames:
            - "host.docker.internal"
            - "epp-postgres-eppoltp"
            - "epp-mgr"
            - "cpp-mongo-configsvr1"
            - "cpp-mongo-configsvr2"
            - "cpp-mongo-configsvr3"
            - "cpp-mongo-shardsvr"
            - "cpp-mongo-shardsvr2"
            - "cpp-mongo-shardsvr3"
            - "epp-mongo-configsvr1"
            - "epp-mongo-configsvr2"
            - "epp-mongo-configsvr3"
            - "epp-mongo-shardsvr"
            - "epp-mongo-shardsvr2"
            - "epp-mongo-shardsvr3"
      initContainers:
        - name: init-link
          image: "{{ .Values.global.imageRegistry }}/cpp-platform:{{ .Values.global.imageTag }}"
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsUser: 0
            privileged: true
          command:
            - "/bin/bash"
            - "-c"
            - |
              bash /opt/ahnlab/cpp/bin/setting/install_link.sh || true
              echo "Fixing permissions for Mongo mounted paths..."
              mkdir -p /nosql/logs /nosql/run /nosql/data
              if [ -f /nosql/conf/mongo_key ]; then
                chmod 600 /nosql/conf/mongo_key
              fi
              chown -R 2500:2500 /opt/ahnlab /permanent /nosql /database /tmp /var/log /home /opt/repo /new /var/run/postgresql || true
          volumeMounts:
            {{- include "cppm.commonVolumeMounts" . | nindent 12 }}
      containers:
        - name: epp-mongo-mongos
          image: "{{ .Values.global.imageRegistry }}/cpp-platform:{{ .Values.global.imageTag }}"
          imagePullPolicy: IfNotPresent
          command: ["/usr/bin/mongos"]
          args: ["--quiet", "--keyFile", "/nosql/conf/mongo_key", "-f", "/nosql/conf/mongos.conf"]
          securityContext:
            privileged: true
          resources:
            limits:
              memory: "512Mi"
          ports:
            - containerPort: 8825
          env:
            - name: REDIS_PASSWORD
              value: "qwe123"
            - name: TZ
              value: "Asia/Seoul"
            - name: CONTAINER_NAME
              value: "cpp-mongo-mongos"
            - name: DOCKER_HOST
              value: "tcp://127.0.0.1:2375"
            - name: JAVA_TOOL_OPTIONS
              value: "-Xms192m -Xmx192m -Dfile.encoding=UTF-8 -Dlogging.config=file:///permanent/etc/config/log4j2.xml -Dlog4j2.configurationFile=file:///permanent/etc/config/log4j2.xml   -Depp.storage.path=/permanent -Depp.home=/opt/ahnlab/cpp -Depp.security.key.path=/permanent/etc/config/site.key -Dahnlab.epp.security.skip=true  "
          volumeMounts:
            {{- include "cppm.commonVolumeMounts" . | nindent 12 }}
      volumes:
        {{- include "cppm.commonVolumes" . | nindent 8 }}
---
apiVersion: v1
kind: Service
metadata:
  name: epp-mongo-mongos
  namespace: {{ .Release.Namespace }}
spec:
  type: ClusterIP
  selector:
    app: epp-mongo-mongos
  ports:
    - port: 8825
      targetPort: 8825
