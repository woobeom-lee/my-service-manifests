apiVersion: apps/v1
kind: Deployment
metadata:
  name: clair-db
  # namespace는 helm install 시 지정한 이름으로 자동 주입됩니다.
  namespace: {{ .Release.Namespace }}
  labels:
    app: clair-db
spec:
  replicas: {{ .Values.database.clairDb.replicas }}
  selector:
    matchLabels:
      app: clair-db
  template:
    metadata:
      labels:
        app: clair-db
    spec:
      nodeSelector:
        # 단일 노드 고정 변수화
        kubernetes.io/hostname: {{ .Values.global.nodeName | quote }}
      containers:
        - name: clair-db
          # 레지스트리, 저장소, 태그를 분리하여 조립합니다.
          image: "{{ .Values.global.imageRegistry }}/{{ .Values.database.clairDb.image.repository }}:{{ .Values.database.clairDb.image.tag }}"
          imagePullPolicy: {{ .Values.database.clairDb.image.pullPolicy }}
          ports:
            - containerPort: 5432
          volumeMounts:
            - name: vol-clair-sql
              mountPath: /root/clair2x-vuln-db.sql
          lifecycle:
            postStart:
              exec:
                command:
                  - "/bin/bash"
                  - "-c"
                  - |
                    for i in {1..30}; do psql -U postgres -c '\q' >/dev/null 2>&1 && break; sleep 2; done;
                    psql -U postgres -c 'SELECT 1 FROM vulnerability LIMIT 1;' >/dev/null 2>&1 || pg_restore -U postgres -d postgres /root/clair2x-vuln-db.sql -c
      volumes:
        - name: vol-clair-sql
          hostPath:
            # 호스트 볼륨의 기본 경로를 변수화합니다.
            path: {{ .Values.global.hostPathBase }}/clair/sql/clair2x-vuln-db.sql
            type: File
---
apiVersion: v1
kind: Service
metadata:
  name: clair-db
  namespace: {{ .Release.Namespace }}
spec:
  ports:
    - name: postgres
      port: 8835
      targetPort: 5432
  selector:
    app: clair-db
