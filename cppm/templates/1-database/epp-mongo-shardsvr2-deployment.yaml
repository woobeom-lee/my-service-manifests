apiVersion: apps/v1
kind: Deployment
metadata:
  name: epp-mongo-shardsvr2
  namespace: {{ .Release.Namespace }}
  labels:
    app: epp-mongo-shardsvr2
spec:
  replicas: {{ .Values.database.mongo.shardsvr2.replicas }}
  selector:
    matchLabels:
      app: epp-mongo-shardsvr2
  template:
    metadata:
      labels:
        app: epp-mongo-shardsvr2
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      nodeSelector:
        kubernetes.io/hostname: {{ .Values.global.nodeName | quote }}
      hostAliases:
        - ip: {{ .Values.global.masterIp | quote }}
          hostnames: []
      initContainers:
        - name: init-shard-script
          image: "{{ .Values.global.imageRegistry }}/cpp-platform:{{ .Values.global.imageTag }}"
          securityContext:
            runAsUser: 0
          command:
            - "/bin/bash"
            - "-c"
            - |
              echo "Patching Mongo Shardsvr scripts for Shard 2..."
              if [ -f /nosql/cmd/epp-mongo-shardsvr.sh ]; then
                # 🚀 수정됨: 옵션은 놔두고 '/shardsvr' 경로만 정확히 '/shardsvr2'로 변경
                sed 's|/shardsvr|/shardsvr2|g' /nosql/cmd/epp-mongo-shardsvr.sh > /nosql/cmd/epp-mongo-shardsvr2.sh || true
                sed 's|/shardsvr|/shardsvr2|g' /nosql/conf/shardsvr.conf > /nosql/conf/epp-mongo-shardsvr2.conf || true
                chown 2500:2500 /nosql/cmd/epp-mongo-shardsvr2.sh /nosql/conf/epp-mongo-shardsvr2.conf || true
                chmod +x /nosql/cmd/epp-mongo-shardsvr2.sh || true
              fi
          volumeMounts:
            - name: vol-nosql
              mountPath: /nosql
 
      containers:
        - name: epp-mongo-shardsvr2
          image: "{{ .Values.global.imageRegistry }}/cpp-platform:{{ .Values.global.imageTag }}"
          imagePullPolicy: IfNotPresent
          command: ["/bin/bash", "/nosql/cmd/epp-mongo-shardsvr2.sh"]
          securityContext:
            runAsUser: 2500
          env:
            - name: TZ
              value: "Asia/Seoul"
          volumeMounts:
            - name: vol-nosql
              mountPath: /nosql
            - name: vol-tmp
              mountPath: /tmp
      volumes:
        - name: vol-nosql
          hostPath:
            path: {{ .Values.global.ahnfsBasePath }}/nosql
            type: DirectoryOrCreate
        - name: vol-tmp
          hostPath:
            path: {{ .Values.global.ahnfsBasePath }}/tmp
            type: DirectoryOrCreate
