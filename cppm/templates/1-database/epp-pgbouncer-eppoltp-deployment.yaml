apiVersion: apps/v1
kind: Deployment
metadata:
  name: epp-pgbouncer-eppoltp
  namespace: {{ .Release.Namespace }}
  labels:
    app: epp-pgbouncer-eppoltp
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: epp-pgbouncer-eppoltp
  template:
    metadata:
      labels:
        app: epp-pgbouncer-eppoltp
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      hostname: cpp-pgbouncer-eppoltp
      securityContext:
        runAsUser: 2500
        runAsGroup: 2500
      nodeSelector:
        kubernetes.io/hostname: {{ .Values.global.nodeName | quote }}
      tolerations:
        - operator: "Exists"
          effect: "NoSchedule"
      hostAliases:
        - ip: {{ .Values.global.masterIp | quote }}
          hostnames:
            - "host.docker.internal"
            - "epp-postgres-eppoltp"
            - "epp-mgr"
      initContainers:
        - name: init-link
          image: "{{ .Values.global.imageRegistry }}/cpp-platform:{{ .Values.global.imageTag }}"
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsUser: 0
            privileged: true
          command:
            - "/bin/bash"
            - "-c"
            - |
              find /permanent /tmp /database -name ".s.PGSQL.8819*" -delete 2>/dev/null || true
              find /permanent /tmp /database -name ".s.PGSQL.8817*" -delete 2>/dev/null || true
              bash /opt/ahnlab/cpp/bin/setting/install_link.sh || true
              for CONF_FILE in /permanent/service/pgbouncer/conf/pgbouncer-cppoltp.cfg /opt/ahnlab/cpp/service/pgbouncer/conf/pgbouncer-cppoltp.cfg; do
                if [ -f "$CONF_FILE" ]; then
                  sed -i 's/^listen_addr.*/listen_addr = 0.0.0.0/g' "$CONF_FILE"
                  sed -i 's/^auth_type.*/auth_type = trust/g' "$CONF_FILE"
                fi
              done
              for ULIST in /permanent/service/pgbouncer/conf/userlist.txt /opt/ahnlab/cpp/service/pgbouncer/conf/userlist.txt; do
                if [ -f "$ULIST" ]; then
                  grep -q '"eppoltpuser"' "$ULIST" || echo '"eppoltpuser" "qweQWE123!@#"' >> "$ULIST"
                  grep -q '"cppoltp"' "$ULIST" || echo '"cppoltp" "qweQWE123!@#"' >> "$ULIST"
                  grep -q '"postgres"' "$ULIST" || echo '"postgres" ""' >> "$ULIST"
                fi
              done
              chown -R 2500:2500 /opt/ahnlab /permanent /nosql /tmp /var/log /home /opt/repo /new || true
              if [ -S /var/run/docker.sock ]; then chmod 666 /var/run/docker.sock; fi
          volumeMounts:
            - name: vol-docker-sock
              mountPath: /var/run/docker.sock
            {{- include "cppm.commonVolumeMounts" . | nindent 12 }}
      containers:
        - name: epp-pgbouncer-eppoltp
          image: "{{ .Values.global.imageRegistry }}/cpp-platform:{{ .Values.global.imageTag }}"
          imagePullPolicy: IfNotPresent
          command: ["/bin/bash", "/opt/ahnlab/cpp/cmd/epp-pgbouncer-eppoltp.sh"]
          securityContext:
            privileged: true
          resources:
            requests:
              memory: "256Mi"
            limits:
              memory: "512Mi"
          ports:
            - containerPort: 8819
          env:
            - name: REDIS_PASSWORD
              value: "qwe123"
            - name: TZ
              value: "Asia/Seoul"
            - name: CONTAINER_NAME
              value: "cpp-pgbouncer-eppoltp"
            - name: DOCKER_HOST
              value: "tcp://127.0.0.1:2375"
            - name: JAVA_TOOL_OPTIONS
              value: "-Xms192m -Xmx192m -Dfile.encoding=UTF-8 -Depp.storage.path=/permanent -Depp.home=/opt/ahnlab/cpp -Depp.security.key.path=/permanent/etc/config/site.key -Dahnlab.epp.security.skip=true"
          volumeMounts:
            - name: vol-docker-sock
              mountPath: /var/run/docker.sock
            {{- include "cppm.commonVolumeMounts" . | nindent 12 }}
      volumes:
        - name: vol-docker-sock
          hostPath:
            path: /var/run/docker.sock
            type: Socket
        {{- include "cppm.commonVolumes" . | nindent 8 }}
---
apiVersion: v1
kind: Service
metadata:
  name: epp-pgbouncer-eppoltp
  namespace: {{ .Release.Namespace }}
spec:
  type: ClusterIP
  selector:
    app: epp-pgbouncer-eppoltp
  ports:
    - port: 8819
      targetPort: 8819
