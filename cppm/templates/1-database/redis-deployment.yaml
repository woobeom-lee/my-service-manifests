apiVersion: apps/v1
kind: Deployment
metadata:
  name: epp-redis
  namespace: {{ .Release.Namespace }}
  labels:
    app: epp-redis
spec:
  replicas: {{ .Values.database.redis.replicas }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: epp-redis
  template:
    metadata:
      labels:
        app: epp-redis
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      hostname: cpp-redis
      securityContext:
        runAsUser: 2500
        runAsGroup: 2500
      nodeSelector:
        kubernetes.io/hostname: {{ .Values.global.nodeName | quote }}
      tolerations:
        - operator: "Exists"
          effect: "NoSchedule"
      hostAliases:
        - ip: {{ .Values.global.masterIp | quote }}
          hostnames:
            - "host.docker.internal"
            - "epp-postgres-eppoltp"
            - "epp-mgr"
      initContainers:
        - name: init-link
          image: "{{ .Values.global.imageRegistry }}/cpp-platform:{{ .Values.global.imageTag }}"
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsUser: 0
            privileged: true
          command:
            - "/bin/bash"
            - "-c"
            - |
              # 디버깅 모드 켜기 (무엇이 실패하는지 로그에 낱낱이 남김)
              set -x
              # 🔥 완전 해결 1: 실제 목적지 디렉터리 강제 생성
              mkdir -p /permanent/service/redis/conf
              # 🔥 완전 해결 2: 꼬여버린 심볼릭 링크를 강제로 끊고 완벽하게 재연결
              mkdir -p /opt/ahnlab/cpp/service/redis
              rm -rf /opt/ahnlab/cpp/service/redis/conf
              ln -sf /permanent/service/redis/conf /opt/ahnlab/cpp/service/redis/conf
              CONF_FILE="/permanent/service/redis/conf/redis.conf"
              # 🔥 완전 해결 3: K8s가 스스로 호스트의 cpp_setup.tar를 열어 '안랩 찐 비밀번호' 파일을 빼옵니다.
              TAR_FILE="/tools/cpp_setup.tar"
              if [ -f "$TAR_FILE" ]; then
                CONF_PATH=$(tar -tf "$TAR_FILE" | grep "redis.conf" | head -n 1)
                if [ -n "$CONF_PATH" ]; then
                  tar -xOf "$TAR_FILE" "$CONF_PATH" > "$CONF_FILE"
                fi
              fi
              # 🔥 완전 해결 4: 추출된 파일에서 비밀번호는 유지하고, 포트(8831)와 통신(0.0.0.0)만 패치합니다.
              if [ -f "$CONF_FILE" ] && [ -s "$CONF_FILE" ]; then
                sed -i '/^bind /d' "$CONF_FILE"
                sed -i '/^port /d' "$CONF_FILE"
                echo "bind 0.0.0.0" >> "$CONF_FILE"
                echo "port 8831" >> "$CONF_FILE"
              else
                # 만약 tar 압축 풀기가 실패했을 경우 파드가 기절하는 것을 막기 위한 비상용 파일
                echo "bind 0.0.0.0" > "$CONF_FILE"
                echo "port 8831" >> "$CONF_FILE"
              fi
              bash /opt/ahnlab/cpp/bin/setting/install_link.sh || true
              chown -R 2500:2500 /opt/ahnlab /permanent /nosql /database /tmp /var/log /home /opt/repo /new /var/run/postgresql || true
              if [ -S /var/run/docker.sock ]; then chmod 666 /var/run/docker.sock; fi
          volumeMounts:
            - name: vol-docker-sock
              mountPath: /var/run/docker.sock
            # tar 파일 추출을 위해 호스트 도구 경로 마운트
            - name: vol-tools
              mountPath: /tools
            {{- include "cppm.commonVolumeMounts" . | nindent 12 }}
      containers:
        - name: epp-redis
          image: "{{ .Values.global.imageRegistry }}/cpp-platform:{{ .Values.global.imageTag }}"
          imagePullPolicy: IfNotPresent
          command: ["/bin/bash", "/opt/ahnlab/cpp/cmd/epp-redis.sh"]
          securityContext:
            privileged: true
          resources:
            limits:
              memory: "512Mi"
          ports:
            - containerPort: 8831
          env:
            - name: TZ
              value: "Asia/Seoul"
            - name: CONTAINER_NAME
              value: "cpp-redis"
            - name: DOCKER_HOST
              value: "tcp://127.0.0.1:2375"
            - name: JAVA_TOOL_OPTIONS
              value: "-Xms192m -Xmx192m -Dfile.encoding=UTF-8 -Dlogging.config=file:///permanent/etc/config/log4j2.xml -Dlog4j2.configurationFile=file:///permanent/etc/config/log4j2.xml   -Depp.storage.path=/permanent -Depp.home=/opt/ahnlab/cpp -Depp.security.key.path=/permanent/etc/config/site.key -Dahnlab.epp.security.skip=true  "
          volumeMounts:
            - name: vol-docker-sock
              mountPath: /var/run/docker.sock
            {{- include "cppm.commonVolumeMounts" . | nindent 12 }}
      volumes:
        - name: vol-docker-sock
          hostPath:
            path: /var/run/docker.sock
            type: Socket
        # tar 파일 추출을 위한 호스트 도구 볼륨 정의
        - name: vol-tools
          hostPath:
            path: /home/registry/my-service-manifests/cppm/tools
            type: Directory
        {{- include "cppm.commonVolumes" . | nindent 8 }}
---
apiVersion: v1
kind: Service
metadata:
  name: epp-redis
  namespace: {{ .Release.Namespace }}
spec:
  type: ClusterIP
  selector:
    app: epp-redis
  ports:
    - port: 8831
      targetPort: 8831
---
apiVersion: v1
kind: Service
metadata:
  name: cpp-redis
  namespace: {{ .Release.Namespace }}
spec:
  type: ClusterIP
  selector:
    app: epp-redis
  ports:
    - port: 8831
      targetPort: 8831
