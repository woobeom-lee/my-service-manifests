apiVersion: apps/v1
kind: Deployment
metadata:
  name: epp-redis
  namespace: {{ .Release.Namespace }}
  labels:
    app: epp-redis
spec:
  replicas: {{ .Values.database.redis.replicas }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: epp-redis
  template:
    metadata:
      labels:
        app: epp-redis
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      hostname: cpp-redis
      securityContext:
        runAsUser: 2500
        runAsGroup: 2500
      nodeSelector:
        kubernetes.io/hostname: {{ .Values.global.nodeName | quote }}
      tolerations:
        - operator: "Exists"
          effect: "NoSchedule"
      hostAliases:
        - ip: {{ .Values.global.masterIp | quote }}
          hostnames:
            - "host.docker.internal"
            - "epp-postgres-eppoltp"
            - "epp-mgr"
      initContainers:
        - name: init-link
          image: "{{ .Values.global.imageRegistry }}/cpp-platform:{{ .Values.global.imageTag }}"
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsUser: 0
            privileged: true
          command:
            - "/bin/bash"
            - "-c"
            - |
              # 1. 볼륨 초기화 대비: 순정 redis.conf 뼈대 파일 강제 주입
              mkdir -p /permanent/service/redis/conf
              if [ ! -f /permanent/service/redis/conf/redis.conf ]; then
                cp /opt/ahnlab/cpp/service/redis/conf/redis.conf /permanent/service/redis/conf/redis.conf 2>/dev/null || touch /permanent/service/redis/conf/redis.conf
              fi
              # 2. 통신 에러 방지 (내부 바인딩 주소를 0.0.0.0으로 개방)
              sed -i '/bind/s/cpp-redis/0.0.0.0/g' /permanent/service/redis/conf/redis.conf
              sed -i '/bind/s/epp-redis/0.0.0.0/g' /permanent/service/redis/conf/redis.conf
              # 3. 안랩 순정 초기화 스크립트 실행 (암호 세팅 등)
              bash /opt/ahnlab/cpp/bin/setting/install_link.sh || true
              # 4. 물리 볼륨 권한 복구 및 도커 소켓 접근 권한 허용
              chown -R 2500:2500 /opt/ahnlab /permanent /nosql /database /tmp /var/log /home /opt/repo /new /var/run/postgresql
              if [ -S /var/run/docker.sock ]; then chmod 666 /var/run/docker.sock; fi
          volumeMounts:
            - name: vol-docker-sock
              mountPath: /var/run/docker.sock
            {{- include "cppm.commonVolumeMounts" . | nindent 12 }}
      containers:
        - name: epp-redis
          image: "{{ .Values.global.imageRegistry }}/cpp-platform:{{ .Values.global.imageTag }}"
          imagePullPolicy: IfNotPresent
          # 안랩 순정 기동 스크립트 사용
          command: ["/bin/bash", "/opt/ahnlab/cpp/cmd/epp-redis.sh"]
          securityContext:
            privileged: true
          resources:
            limits:
              memory: "512Mi"
          ports:
            - containerPort: 8831
          env:
            - name: TZ
              value: "Asia/Seoul"
            - name: CONTAINER_NAME
              value: "cpp-redis"
            - name: DOCKER_HOST
              value: "tcp://127.0.0.1:2375"
            - name: JAVA_TOOL_OPTIONS
              value: "-Xms192m -Xmx192m -Dfile.encoding=UTF-8 -Dlogging.config=file:///permanent/etc/config/log4j2.xml -Dlog4j2.configurationFile=file:///permanent/etc/config/log4j2.xml   -Depp.storage.path=/permanent -Depp.home=/opt/ahnlab/cpp -Depp.security.key.path=/permanent/etc/config/site.key -Dahnlab.epp.security.skip=true  "
          volumeMounts:
            - name: vol-docker-sock
              mountPath: /var/run/docker.sock
            {{- include "cppm.commonVolumeMounts" . | nindent 12 }}
      volumes:
        - name: vol-docker-sock
          hostPath:
            path: /var/run/docker.sock
            type: Socket
        {{- include "cppm.commonVolumes" . | nindent 8 }}
---
apiVersion: v1
kind: Service
metadata:
  name: epp-redis
  namespace: {{ .Release.Namespace }}
spec:
  type: ClusterIP
  selector:
    app: epp-redis
  ports:
    - port: 8831
      targetPort: 8831
---
# 🔥 추가된 핵심 로직: Tomcat/Syslog가 옛날 이름(cpp-redis)으로 찾아와도 정상 연결해주는 서비스
apiVersion: v1
kind: Service
metadata:
  name: cpp-redis
  namespace: {{ .Release.Namespace }}
spec:
  type: ClusterIP
  selector:
    app: epp-redis
  ports:
    - port: 8831
      targetPort: 8831
