apiVersion: apps/v1
kind: Deployment
metadata:
  name: epp-redis
  namespace: {{ .Release.Namespace }}
  labels:
    app: epp-redis
spec:
  replicas: {{ .Values.database.redis.replicas }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: epp-redis
  template:
    metadata:
      labels:
        app: epp-redis
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      hostname: cpp-redis
      securityContext:
        runAsUser: 2500
        runAsGroup: 2500
      nodeSelector:
        kubernetes.io/hostname: {{ .Values.global.nodeName | quote }}
      tolerations:
        - operator: "Exists"
          effect: "NoSchedule"
      hostAliases:
        - ip: {{ .Values.global.masterIp | quote }}
          hostnames:
            - "host.docker.internal"
            - "epp-postgres-eppoltp"
            - "epp-mgr"
      initContainers:
        - name: init-link
          image: "{{ .Values.global.imageRegistry }}/cpp-platform:{{ .Values.global.imageTag }}"
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsUser: 0
            privileged: true
          command:
            - "/bin/bash"
            - "-c"
            - |
              CONF_FILE="/permanent/service/redis/conf/redis.conf"
              # 🔥 해결 1: 빈 폴더를 억지로 만들지 않고, nfs-init 작업이 순정 파일을 생성할 때까지 기다립니다.
              count=0
              while [ ! -f "$CONF_FILE" ]; do
                sleep 2
                count=$((count+1))
                if [ $count -ge 30 ]; then break; fi
              done
              # 🔥 해결 2: 순정 파일(찐 비밀번호가 포함됨)이 생성되면 포트(8831)와 통신망만 패치합니다.
              if [ -f "$CONF_FILE" ]; then
                sed -i '/^bind /d' "$CONF_FILE"
                sed -i '/^port /d' "$CONF_FILE"
                echo "bind 0.0.0.0" >> "$CONF_FILE"
                echo "port 8831" >> "$CONF_FILE"
              fi
              bash /opt/ahnlab/cpp/bin/setting/install_link.sh || true
              chown -R 2500:2500 /opt/ahnlab /permanent /nosql /database /tmp /var/log /home /opt/repo /new /var/run/postgresql || true
              if [ -S /var/run/docker.sock ]; then chmod 666 /var/run/docker.sock; fi
          volumeMounts:
            - name: vol-docker-sock
              mountPath: /var/run/docker.sock
            {{- include "cppm.commonVolumeMounts" . | nindent 12 }}
      containers:
        - name: epp-redis
          image: "{{ .Values.global.imageRegistry }}/cpp-platform:{{ .Values.global.imageTag }}"
          imagePullPolicy: IfNotPresent
          command: ["/bin/bash", "/opt/ahnlab/cpp/cmd/epp-redis.sh"]
          securityContext:
            privileged: true
          resources:
            limits:
              memory: "512Mi"
          ports:
            - containerPort: 8831
          env:
            - name: TZ
              value: "Asia/Seoul"
            - name: CONTAINER_NAME
              value: "cpp-redis"
            - name: DOCKER_HOST
              value: "tcp://127.0.0.1:2375"
            - name: JAVA_TOOL_OPTIONS
              value: "-Xms192m -Xmx192m -Dfile.encoding=UTF-8 -Dlogging.config=file:///permanent/etc/config/log4j2.xml -Dlog4j2.configurationFile=file:///permanent/etc/config/log4j2.xml   -Depp.storage.path=/permanent -Depp.home=/opt/ahnlab/cpp -Depp.security.key.path=/permanent/etc/config/site.key -Dahnlab.epp.security.skip=true  "
          volumeMounts:
            - name: vol-docker-sock
              mountPath: /var/run/docker.sock
            {{- include "cppm.commonVolumeMounts" . | nindent 12 }}
      volumes:
        - name: vol-docker-sock
          hostPath:
            path: /var/run/docker.sock
            type: Socket
        {{- include "cppm.commonVolumes" . | nindent 8 }}
---
apiVersion: v1
kind: Service
metadata:
  name: epp-redis
  namespace: {{ .Release.Namespace }}
spec:
  type: ClusterIP
  selector:
    app: epp-redis
  ports:
    - port: 8831
      targetPort: 8831
---
apiVersion: v1
kind: Service
metadata:
  name: cpp-redis
  namespace: {{ .Release.Namespace }}
spec:
  type: ClusterIP
  selector:
    app: epp-redis
  ports:
    - port: 8831
      targetPort: 8831
