apiVersion: apps/v1
kind: Deployment
metadata:
  name: epp-redis
  namespace: {{ .Release.Namespace }}
  labels:
    app: epp-redis
spec:
  replicas: {{ .Values.database.redis.replicas }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: epp-redis
  template:
    metadata:
      labels:
        app: epp-redis
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      hostname: cpp-redis
      securityContext:
        runAsUser: 2500
        runAsGroup: 2500
      nodeSelector:
        kubernetes.io/hostname: {{ .Values.global.nodeName | quote }}
      tolerations:
        - operator: "Exists"
          effect: "NoSchedule"
      hostAliases:
        - ip: {{ .Values.global.masterIp | quote }}
          hostnames:
            - "host.docker.internal"
            - "epp-postgres-eppoltp"
            - "epp-mgr"
      initContainers:
        - name: init-link
          image: "{{ .Values.global.imageRegistry }}/cpp-platform:{{ .Values.global.imageTag }}"
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsUser: 0
            privileged: true
          command:
            - "/bin/bash"
            - "-c"
            - |
              # 1. 볼륨을 지웠든 안 지웠든 무조건 순정 파일 복구를 위해 기존 파일 삭제
              rm -f /permanent/service/redis/conf/redis.conf
              # 2. 안랩 순정 설정 스크립트 실행 (redis.conf에 순정 암호가 자동 세팅됨)
              bash /opt/ahnlab/cpp/bin/setting/install_link.sh || true
              # 3. bind 주소만 0.0.0.0으로 통신 가능하게 오픈
              CONF_FILE="/permanent/service/redis/conf/redis.conf"
              if [ -f "$CONF_FILE" ]; then
                sed -i '/bind/s/cpp-redis/0.0.0.0/g' "$CONF_FILE"
              fi
              # 4. 권한 복구 및 도커 소켓 권한 부여
              chown -R 2500:2500 /opt/ahnlab /permanent /nosql /database /tmp /var/log /home /opt/repo /new /var/run/postgresql
              if [ -S /var/run/docker.sock ]; then chmod 666 /var/run/docker.sock; fi
          volumeMounts:
            - name: vol-docker-sock
              mountPath: /var/run/docker.sock
            {{- include "cppm.commonVolumeMounts" . | nindent 12 }}
      containers:
        - name: epp-redis
          image: "{{ .Values.global.imageRegistry }}/cpp-platform:{{ .Values.global.imageTag }}"
          imagePullPolicy: IfNotPresent
          # 원본 실행 스크립트로 롤백 (순정 암호 적용)
          command: ["/bin/bash", "/opt/ahnlab/cpp/cmd/epp-redis.sh"]
          securityContext:
            privileged: true
          resources:
            limits:
              memory: "512Mi"
          ports:
            - containerPort: 8831
          env:
            - name: TZ
              value: "Asia/Seoul"
            - name: CONTAINER_NAME
              value: "cpp-redis"
            - name: DOCKER_HOST
              value: "tcp://127.0.0.1:2375"
            - name: JAVA_TOOL_OPTIONS
              value: "-Xms192m -Xmx192m -Dfile.encoding=UTF-8 -Dlogging.config=file:///permanent/etc/config/log4j2.xml -Dlog4j2.configurationFile=file:///permanent/etc/config/log4j2.xml   -Depp.storage.path=/permanent -Depp.home=/opt/ahnlab/cpp -Depp.security.key.path=/permanent/etc/config/site.key -Dahnlab.epp.security.skip=true  "
          volumeMounts:
            - name: vol-docker-sock
              mountPath: /var/run/docker.sock
            {{- include "cppm.commonVolumeMounts" . | nindent 12 }}
      volumes:
        - name: vol-docker-sock
          hostPath:
            path: /var/run/docker.sock
            type: Socket
        {{- include "cppm.commonVolumes" . | nindent 8 }}
---
apiVersion: v1
kind: Service
metadata:
  name: epp-redis
  namespace: {{ .Release.Namespace }}
spec:
  type: ClusterIP
  selector:
    app: epp-redis
  ports:
    - port: 8831
      targetPort: 8831
---
# 🔥 추가된 부분: cpp-redis로 들어오는 요청도 epp-redis 파드로 연결해주는 이중 서비스 생성
apiVersion: v1
kind: Service
metadata:
  name: cpp-redis
  namespace: {{ .Release.Namespace }}
spec:
  type: ClusterIP
  selector:
    app: epp-redis
  ports:
    - port: 8831
      targetPort: 8831
