apiVersion: apps/v1
kind: Deployment
metadata:
  name: epp-mongo-shardsvr
  namespace: {{ .Release.Namespace }}
  labels:
    app: epp-mongo-shardsvr
spec:
  replicas: {{ .Values.database.mongo.shardsvr1.replicas }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: epp-mongo-shardsvr
  template:
    metadata:
      labels:
        app: epp-mongo-shardsvr
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      hostname: cpp-mongo-shardsvr
      nodeSelector:
        kubernetes.io/hostname: {{ .Values.global.nodeName | quote }}
      tolerations:
        - operator: "Exists"
          effect: "NoSchedule"
      hostAliases:
        - ip: {{ .Values.global.masterIp | quote }}
          hostnames:
            - "host.docker.internal"
            - "epp-postgres-eppoltp"
            - "epp-mgr"
            - "cpp-tomcat-auth"
            - "cpp-tomcat-console"
            - "cpp-nginx"
            - "cpp-scheduler"
            - "cpp-batch-processor"
      initContainers:
        - name: init-link
          image: "{{ .Values.global.imageRegistry }}/cpp-platform:{{ .Values.global.imageTag }}"
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsUser: 0
            privileged: true
          command:
            - "/bin/bash"
            - "-c"
            - |
              echo "Checking Postgres DB connectivity on host port 8817..."
              until true || timeout 1 bash -c "</dev/tcp/127.0.0.1/8817" 2>/dev/null; do
                echo "Database is not ready yet, waiting 3 seconds..."
                sleep 3
              done
              echo "Database connected successfully! Starting AhnLab setup..."
              bash /opt/ahnlab/cpp/bin/setting/install_link.sh || true
              echo "Fixing permissions for ShardSvr mounted paths..."
              mkdir -p /opt/repo /new /permanent /nosql /database /tmp /var/log /home /var/run/postgresql
              echo "Creating shardsvr data directory..."
              mkdir -p /nosql/data/shardsvr
              echo "Securing mongo_key permissions to 600..."
              if [ -f /nosql/conf/mongo_key ]; then
                chmod 600 /nosql/conf/mongo_key
              fi
              chown -R 2500:2500 /opt/ahnlab /permanent /nosql /database /tmp /var/log /home /opt/repo /new /var/run/postgresql || true
          volumeMounts:
            - name: vol-docker-sock
              mountPath: /var/run/docker.sock
            {{- include "cppm.commonVolumeMounts" . | nindent 12 }}
      containers:
        - name: epp-mongo-shardsvr
          image: "{{ .Values.global.imageRegistry }}/cpp-platform:{{ .Values.global.imageTag }}"
          imagePullPolicy: IfNotPresent
          command: ["/bin/bash", "/nosql/cmd/epp-mongo-shardsvr.sh"]
          securityContext:
            runAsUser: 0
            privileged: true
          resources:
            requests:
              memory: "512Mi"
            limits:
              memory: "1Gi"
          ports:
            - containerPort: 8824
          env:
            - name: TZ
              value: "Asia/Seoul"
            - name: CONTAINER_NAME
              value: "cpp-mongo-shardsvr"
            - name: DOCKER_HOST
              value: "unix:///var/run/docker.sock"
            - name: JAVA_TOOL_OPTIONS
              value: "-Xms512m -Xmx1024m -Dfile.encoding=UTF-8 -Dlogging.config=file:///permanent/etc/config/log4j2.xml -Dlog4j2.configurationFile=file:///permanent/etc/config/log4j2.xml   -Depp.storage.path=/permanent -Depp.home=/opt/ahnlab/cpp -Depp.security.key.path=/permanent/etc/config/site.key -Dahnlab.epp.security.skip=true  "
          volumeMounts:
            - name: vol-docker-sock
              mountPath: /var/run/docker.sock
            {{- include "cppm.commonVolumeMounts" . | nindent 12 }}
      volumes:
        - name: vol-docker-sock
          hostPath:
            path: /var/run/docker.sock
            type: Socket
        {{- include "cppm.commonVolumes" . | nindent 8 }}
---
apiVersion: v1
kind: Service
metadata:
  name: epp-mongo-shardsvr
  namespace: {{ .Release.Namespace }}
spec:
  ports:
    - port: 8824
      targetPort: 8824
  selector:
    app: epp-mongo-shardsvr
