apiVersion: batch/v1
kind: Job
metadata:
  name: nfs-init
  namespace: {{ .Release.Namespace }}
  # 🚀 대본과 세트로 맞춘 PreSync 훅
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  backoffLimit: 1
  template:
    metadata:
      name: nfs-init
    spec:
      restartPolicy: Never
      containers:
        - name: nfs-init
          image: "{{ .Values.global.imageRegistry }}/cpp-platform:{{ .Values.global.imageTag }}"
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsUser: 0
            privileged: true
          command:
            - "/bin/bash"
            - "/init/init.sh"
          volumeMounts:
            - name: vol-ahnfs-root
              mountPath: /nfs
            - name: vol-init-script
              mountPath: /init
            - name: vol-tools
              mountPath: /tools
      volumes:
        - name: vol-ahnfs-root
          hostPath:
            path: {{ .Values.global.ahnfsBasePath }}
            type: DirectoryOrCreate
        - name: vol-init-script
          configMap:
            name: nfs-init-file-cm
            defaultMode: 0777
        - name: vol-tools
          hostPath:
            # 🚀 Git 저장소 내부의 '단일 원본' 도구함 폴더를 정확히 지칭!
            path: /home/registry/my-service-manifests/cppm/tools
            type: DirectoryOrCreate
