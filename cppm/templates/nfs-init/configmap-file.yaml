apiVersion: v1
kind: ConfigMap
metadata:
  name: nfs-init-file-cm
data:
  # ========================================================
  # 메인 실행 파일
  # ========================================================
  init.sh: |-
    #!/bin/bash
    echo "==== 1. Extracting Setup Files ===="
    bash /init/01-extract.sh
    echo "==== 2. Reorganizing & Fixing Mounts ===="
    bash /init/02-setup.sh
    echo "==== 3. Applying Permissions ===="
    bash /init/03-perm.sh
    echo "==== NFS Initialization Completed Successfully! ===="
 
  # ========================================================
  # 1. 압축 해제 담당 스크립트
  # ========================================================
  01-extract.sh: |-
    #!/bin/bash
    if [ -f "/nfs/opt/ahnlab/cpp/bin/setting/install_link.sh" ]; then
      echo "[SKIP] Core files are already extracted."
      exit 0
    fi
    if [ -f "/tools/cpp_setup.tar" ]; then
      mkdir -p /tmp/setup_extract
      tar -xf /tools/cpp_setup.tar -C /tmp/setup_extract/
      AHNFS_TAR=$(find /tmp/setup_extract -name "ahnfs.tar.gz" | head -n 1)
      if [ -n "$AHNFS_TAR" ]; then
        tar -zxvf "$AHNFS_TAR" -C /nfs/ > /dev/null
      fi
      rm -rf /tmp/setup_extract
    elif [ -f "/tools/ahnfs.tar.gz" ]; then
      tar -zxvf /tools/ahnfs.tar.gz -C /nfs/ > /dev/null
    else
      echo "[ERROR] Setup tar file not found in /tools directory!"
      exit 1
    fi
 
  # ========================================================
  # 2. 경로 맞춤 & 설정 파일(XML, 폴더) 자동 생성 스크립트
  # ========================================================
  02-setup.sh: |-
    #!/bin/bash
    # (1) 잘못 풀린 폴더들 제자리로 이동
    mkdir -p /nfs/opt/ahnlab/cpp
    if [ -d "/nfs/bin" ] && [ -d "/nfs/cmd" ]; then
      mv /nfs/bin /nfs/cmd /nfs/setting /nfs/version.ini /nfs/opt/ahnlab/cpp/ 2>/dev/null || true
    fi
    if [ -d "/nfs/ahnfs/opt/ahnlab/cpp" ]; then
      cp -r /nfs/ahnfs/opt/ahnlab/cpp/* /nfs/opt/ahnlab/cpp/ 2>/dev/null || true
    fi
    if [ -d "/nfs/ahnfs" ]; then
      mv /nfs/ahnfs/* /nfs/ 2>/dev/null || true
      rm -rf /nfs/ahnfs
    fi
 
    # (2) K8s 볼륨 마운트 에러 방지용 빈 파일 생성
    mkdir -p /nfs/etc /nfs/permanent/clair/sql /nfs/permanent/clair/config
    FILES=("/nfs/etc/sudoers" "/nfs/etc/login.defs" "/nfs/etc/crontab" "/nfs/permanent/clair/sql/clair2x-vuln-db.sql" "/nfs/permanent/clair/config/config.yaml")
    for file in "${FILES[@]}"; do
      if [ -d "$file" ]; then rm -rf "$file"; fi
      touch "$file"
    done
 
    # (3) Java 애플리케이션용 log4j2.xml 자동 생성 (vi 에러 방지용 echo 처리)
    mkdir -p /nfs/permanent/etc/config
    LOG_XML="/nfs/permanent/etc/config/log4j2.xml"
    echo '<?xml version="1.0" encoding="UTF-8"?>' > $LOG_XML
    echo '<Configuration status="INFO">' >> $LOG_XML
    echo '  <Appenders>' >> $LOG_XML
    echo '    <Console name="Console" target="SYSTEM_OUT">' >> $LOG_XML
    echo '      <PatternLayout pattern="%d{yyyy-MM-dd HH:mm:ss} [%t] %-5level %logger{36} - %msg%n"/>' >> $LOG_XML
    echo '    </Console>' >> $LOG_XML
    echo '  </Appenders>' >> $LOG_XML
    echo '  <Loggers>' >> $LOG_XML
    echo '    <Root level="info">' >> $LOG_XML
    echo '      <AppenderRef ref="Console"/>' >> $LOG_XML
    echo '    </Root>' >> $LOG_XML
    echo '  </Loggers>' >> $LOG_XML
    echo '</Configuration>' >> $LOG_XML
    # (4) 로그 폴더 일괄 생성
    mkdir -p /nfs/opt/ahnlab/cpp/log/{cmd,batch-processor,cluster-manager,scheduler,syslog-sender,tomcat-agent,tomcat-console,tomcat-auth,kafka-consumer,eureka-server,eureka-gateway}
 
  # ========================================================
  # 3. 권한 부여 담당 스크립트
  # ========================================================
  03-perm.sh: |-
    #!/bin/bash
    chmod -R 777 /nfs
    find /nfs -type d -name "cppoltpdata" -exec chmod 700 {} \;
