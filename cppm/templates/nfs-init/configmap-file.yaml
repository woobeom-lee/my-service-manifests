apiVersion: v1
kind: ConfigMap
metadata:
  name: nfs-init-file-cm
data:
  init.sh: |-
    #!/bin/bash
    bash /init/01-extract.sh
    bash /init/02-setup.sh
    bash /init/03-perm.sh
 
  01-extract.sh: |-
    #!/bin/bash
    if [ -f "/nfs/permanent/etc/config/cpp_opensearch.properties" ]; then
      echo "[SKIP] Original AhnLab files are already extracted."
      exit 0
    fi
    echo "Extracting Original AhnLab Packages..."
    if [ -f "/tools/cpp_setup.tar" ]; then
      mkdir -p /tmp/setup_extract /tmp/ahnfs_ext
      tar -xf /tools/cpp_setup.tar -C /tmp/setup_extract/
      AHNFS_TAR=$(find /tmp/setup_extract -name "ahnfs.tar.gz" | head -n 1)
      if [ -n "$AHNFS_TAR" ]; then
        echo "Found ahnfs.tar.gz at: $AHNFS_TAR. Extracting..."
        tar -zxf "$AHNFS_TAR" -C /tmp/ahnfs_ext/
        PERM_DIR=$(find /tmp/ahnfs_ext -type d -name "permanent" | head -n 1)
        if [ -n "$PERM_DIR" ]; then
          BASE_DIR=$(dirname "$PERM_DIR")
          echo "Found AhnLab root directory at: $BASE_DIR. Copying to /nfs/..."
          cp -a "$BASE_DIR"/* /nfs/
          echo "Extraction and copy completed successfully!"
        else
          echo "[ERROR] Could not find 'permanent' directory inside ahnfs.tar.gz!"
        fi
      else
        echo "[ERROR] ahnfs.tar.gz not found inside cpp_setup.tar!"
      fi
      rm -rf /tmp/setup_extract /tmp/ahnfs_ext
    elif [ -f "/tools/ahnfs.tar.gz" ]; then
      mkdir -p /tmp/ahnfs_ext
      tar -zxf /tools/ahnfs.tar.gz -C /tmp/ahnfs_ext/
      PERM_DIR=$(find /tmp/ahnfs_ext -type d -name "permanent" | head -n 1)
      if [ -n "$PERM_DIR" ]; then
        BASE_DIR=$(dirname "$PERM_DIR")
        cp -a "$BASE_DIR"/* /nfs/
      fi
      rm -rf /tmp/ahnfs_ext
    else
      echo "[ERROR] Setup tar file not found in /tools directory!"
    fi
 
  02-setup.sh: |-
    #!/bin/bash
    mkdir -p /nfs/opt/ahnlab/cpp
    if [ -d "/nfs/bin" ] && [ -d "/nfs/cmd" ]; then
      mv /nfs/bin /nfs/cmd /nfs/setting /nfs/version.ini /nfs/opt/ahnlab/cpp/ 2>/dev/null || true
    fi
    if [ -d "/nfs/ahnfs/opt/ahnlab/cpp" ]; then cp -r /nfs/ahnfs/opt/ahnlab/cpp/* /nfs/opt/ahnlab/cpp/ 2>/dev/null || true; fi
    if [ -d "/nfs/ahnfs" ]; then mv /nfs/ahnfs/* /nfs/ 2>/dev/null || true; rm -rf /nfs/ahnfs; fi
 
    mkdir -p /nfs/etc /nfs/permanent/clair/sql /nfs/permanent/clair/config
    FILES=("/nfs/etc/sudoers" "/nfs/etc/login.defs" "/nfs/etc/crontab" "/nfs/permanent/clair/sql/clair2x-vuln-db.sql" "/nfs/permanent/clair/config/config.yaml")
    for file in "${FILES[@]}"; do
      if [ ! -f "$file" ]; then touch "$file"; fi
    done
 
    mkdir -p /nfs/permanent/etc/config
    LOG_XML="/nfs/permanent/etc/config/log4j2.xml"
    if [ ! -f "$LOG_XML" ]; then
      echo "" | base64 -d > "$LOG_XML"
    fi
    if [ -f "/nfs/opt/ahnlab/cpp/log" ]; then rm -f /nfs/opt/ahnlab/cpp/log; fi
    mkdir -p /nfs/opt/ahnlab/cpp/log/{cmd,batch-processor,cluster-manager,scheduler,syslog-sender,tomcat-agent,tomcat-console,tomcat-auth,kafka-consumer,eureka-server,eureka-gateway}
 
    # 🚀 [신규 추가 1] Kafka 파티션 롤(Role) 파일 생성 (기본값 1)
    echo "Creating Kafka role config..."
    mkdir -p /nfs/permanent/save
    echo "kafka_partition_count=1" > /nfs/permanent/save/kafka_role
 
    # 🚀 [신규 추가 2] 내부 인증서 자동 갱신 스크립트 실행
    CERT_SCRIPT="/nfs/opt/ahnlab/install/postinstall/010_host_certificate_update.sh"
    if [ -f "$CERT_SCRIPT" ]; then
      echo "Running AhnLab Certificate Update Script..."
      # 원본 스크립트가 참조하는 환경변수(storage_dir)를 맞물려줌
      export storage_dir=/nfs
      # 스크립트 실행 권한 부여 후 실행 (에러가 나도 init이 중단되지 않도록 || true 추가)
      chmod +x "$CERT_SCRIPT"
      bash "$CERT_SCRIPT" install || true
      echo "Certificate Update Completed."
    else
      echo "[WARNING] Certificate script not found at $CERT_SCRIPT"
    fi
 
  03-perm.sh: |-
    #!/bin/bash
    chmod -R 777 /nfs
    find /nfs -type d -name "cppoltpdata" -exec chmod 700 {} \;
    chown -R 2500:2500 /nfs/opt/ahnlab /nfs/permanent /nfs/nosql /nfs/database /nfs/var /nfs/tmp /nfs/home 2>/dev/null || true
