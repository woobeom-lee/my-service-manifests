apiVersion: v1
kind: ConfigMap
metadata:
  name: nfs-init-file-cm
data:
  init.sh: |-
    #!/bin/bash
    echo "==== Starting On-Premise NFS Initialization ===="
    # 1. CPPM이 사용할 기본 NFS 디렉토리들만 순수하게 생성
    mkdir -p /nfs/log
    mkdir -p /nfs/etc
    mkdir -p /nfs/data
    # 2. 파드들이 접근할 수 있도록 권한 부여
    chmod -R 777 /nfs
    echo "==== NFS Initialization Completed Successfully! ===="
