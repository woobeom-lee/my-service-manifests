apiVersion: v1
kind: ConfigMap
metadata:
  name: nfs-init-file-cm
data:
  init.sh: |-
    #!/bin/bash
    bash /init/01-extract.sh
    bash /init/02-setup.sh
    bash /init/03-perm.sh
 
  01-extract.sh: |-
    #!/bin/bash
    if [ -f "/nfs/opt/ahnlab/cpp/bin/setting/install_link.sh" ]; then exit 0; fi
    if [ -f "/tools/cpp_setup.tar" ]; then
      mkdir -p /tmp/setup_extract
      tar -xf /tools/cpp_setup.tar -C /tmp/setup_extract/
      AHNFS_TAR=$(find /tmp/setup_extract -name "ahnfs.tar.gz" | head -n 1)
      if [ -n "$AHNFS_TAR" ]; then tar -zxvf "$AHNFS_TAR" -C /nfs/ > /dev/null; fi
      rm -rf /tmp/setup_extract
    elif [ -f "/tools/ahnfs.tar.gz" ]; then
      tar -zxvf /tools/ahnfs.tar.gz -C /nfs/ > /dev/null
    fi
 
  02-setup.sh: |-
    #!/bin/bash
    mkdir -p /nfs/opt/ahnlab/cpp
    if [ -d "/nfs/bin" ] && [ -d "/nfs/cmd" ]; then
      mv /nfs/bin /nfs/cmd /nfs/setting /nfs/version.ini /nfs/opt/ahnlab/cpp/ 2>/dev/null || true
    fi
    if [ -d "/nfs/ahnfs/opt/ahnlab/cpp" ]; then cp -r /nfs/ahnfs/opt/ahnlab/cpp/* /nfs/opt/ahnlab/cpp/ 2>/dev/null || true; fi
    if [ -d "/nfs/ahnfs" ]; then mv /nfs/ahnfs/* /nfs/ 2>/dev/null || true; rm -rf /nfs/ahnfs; fi
 
    mkdir -p /nfs/etc /nfs/permanent/clair/sql /nfs/permanent/clair/config
    FILES=("/nfs/etc/sudoers" "/nfs/etc/login.defs" "/nfs/etc/crontab" "/nfs/permanent/clair/sql/clair2x-vuln-db.sql" "/nfs/permanent/clair/config/config.yaml")
    for file in "${FILES[@]}"; do
      if [ -d "$file" ]; then rm -rf "$file"; fi
      touch "$file"
    done
 
    # 🚀 XML 파싱 에러 방지를 위한 Base64 암호화 주입 방식
    mkdir -p /nfs/permanent/etc/config
    LOG_XML="/nfs/permanent/etc/config/log4j2.xml"
    if [ -d "$LOG_XML" ]; then rm -rf "$LOG_XML"; fi
    echo "" | base64 -d > "$LOG_XML"
    if [ -f "/nfs/opt/ahnlab/cpp/log" ]; then rm -f /nfs/opt/ahnlab/cpp/log; fi
    mkdir -p /nfs/opt/ahnlab/cpp/log/{cmd,batch-processor,cluster-manager,scheduler,syslog-sender,tomcat-agent,tomcat-console,tomcat-auth,kafka-consumer,eureka-server,eureka-gateway}
 
  03-perm.sh: |-
    #!/bin/bash
    chmod -R 777 /nfs
    find /nfs -type d -name "cppoltpdata" -exec chmod 700 {} \;
    chown -R 2500:2500 /nfs/opt/ahnlab /nfs/permanent 2>/dev/null || true
