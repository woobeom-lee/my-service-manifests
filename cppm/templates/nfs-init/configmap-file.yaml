apiVersion: v1
kind: ConfigMap
metadata:
  name: nfs-init-file-cm
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/hook: PreSync
    helm.sh/hook: pre-install,pre-upgrade
data:
  init.sh: |-
    #!/bin/bash
    bash /init/01-extract.sh
    bash /init/02-setup.sh
    bash /init/03-perm.sh
 
  01-extract.sh: |-
    #!/bin/bash
    echo "Cleaning up Kubelet ghost directories..."
    for BAD_DIR in /nfs/etc/crontab /nfs/etc/sudoers /nfs/etc/login.defs /nfs/etc/fstab /nfs/permanent/clair/config/config.yaml /nfs/permanent/clair/sql/clair2x-vuln-db.sql; do
      if [ -d "$BAD_DIR" ]; then rm -rf "$BAD_DIR"; fi
    done
    if [ -f "/nfs/permanent/etc/config/cpp_opensearch.properties" ] && [ -f "/nfs/permanent/etc/config/site.key" ]; then
      echo "[SKIP] Original AhnLab files are already extracted."
      exit 0
    fi
    echo "Extracting Original AhnLab Packages..."
    if [ -f "/tools/cpp_setup.tar" ]; then
      mkdir -p /tmp/setup_extract /tmp/ahnfs_ext
      tar -xf /tools/cpp_setup.tar -C /tmp/setup_extract/
      AHNFS_TAR=$(find /tmp/setup_extract -name "ahnfs.tar.gz" | head -n 1)
      if [ -n "$AHNFS_TAR" ]; then
        tar -zxf "$AHNFS_TAR" -C /tmp/ahnfs_ext/
        if [ -d "/tmp/ahnfs_ext/ahnfs" ]; then
          cp -a /tmp/ahnfs_ext/ahnfs/* /nfs/
        else
          cp -a /tmp/ahnfs_ext/* /nfs/
        fi
      fi
      # 🚀 인증서 스크립트 실행을 위해 백업본 강제 이식
      INSTALL_DIR=$(find /tmp/setup_extract -type d -name "install" | head -n 1)
      if [ -n "$INSTALL_DIR" ]; then
        mkdir -p /nfs/opt/ahnlab
        cp -a "$INSTALL_DIR" /nfs/opt/ahnlab/
      fi
      rm -rf /tmp/setup_extract /tmp/ahnfs_ext
    fi
 
  02-setup.sh: |-
    #!/bin/bash
    mkdir -p /nfs/etc /nfs/permanent/clair/sql /nfs/permanent/clair/config
    FILES=("/nfs/etc/sudoers" "/nfs/etc/login.defs" "/nfs/etc/crontab" "/nfs/permanent/clair/sql/clair2x-vuln-db.sql" "/nfs/permanent/clair/config/config.yaml")
    for file in "${FILES[@]}"; do
      if [ ! -f "$file" ]; then touch "$file"; fi
    done
 
    mkdir -p /nfs/permanent/etc/config
    LOG_XML="/nfs/permanent/etc/config/log4j2.xml"
    if [ ! -f "$LOG_XML" ]; then
      echo "" | base64 -d > "$LOG_XML"
    fi
    # 🚀 epp_common.sh 누락 방지: install 폴더에서 강제 복구
    if [ -d "/nfs/opt/ahnlab/install/bin" ]; then
      mkdir -p /nfs/opt/ahnlab/cpp
      cp -a /nfs/opt/ahnlab/install/bin /nfs/opt/ahnlab/cpp/ 2>/dev/null || true
      cp -a /nfs/opt/ahnlab/install/cmd /nfs/opt/ahnlab/cpp/ 2>/dev/null || true
      cp -a /nfs/opt/ahnlab/install/setting /nfs/opt/ahnlab/cpp/ 2>/dev/null || true
    fi
 
    rm -rf /nfs/opt/ahnlab/cpp/log
    mkdir -p /nfs/opt/ahnlab/cpp/log/{cmd,batch-processor,cluster-manager,scheduler,syslog-sender,tomcat-agent,tomcat-console,tomcat-auth,kafka-consumer,eureka-server,eureka-gateway}
 
    echo "kafka_partition_count=1" > /nfs/permanent/save/kafka_role
 
    echo "storage=/nfs" > /nfs/.epp_storage_path
    rm -rf /nfs/ahnfs /opt/ahnfs
    ln -snf /nfs /nfs/ahnfs
    mkdir -p /opt && ln -snf /nfs /opt/ahnfs
    echo '#!/bin/bash' > /usr/bin/docker
    echo 'exit 0' >> /usr/bin/docker
    chmod +x /usr/bin/docker
    cp /usr/bin/docker /bin/docker
    cp /usr/bin/docker /usr/local/bin/docker
 
    CERT_SCRIPT="/nfs/opt/ahnlab/install/postinstall/010_host_certificate_update.sh"
    if [ -f "$CERT_SCRIPT" ]; then
      export storage_dir=/nfs
      chmod +x "$CERT_SCRIPT"
      bash "$CERT_SCRIPT" install || true
    fi
    rm -f /nfs/ahnfs /opt/ahnfs
 
    if [ -f "/nfs/nosql/cmd/epp-mongo-shardsvr.sh" ]; then
      cp /nfs/nosql/cmd/epp-mongo-shardsvr.sh /nfs/nosql/cmd/epp-mongo-shardsvr2.sh
      cp /nfs/nosql/cmd/epp-mongo-shardsvr.sh /nfs/nosql/cmd/epp-mongo-shardsvr3.sh
    fi
    if [ -f "/nfs/nosql/conf/epp-mongo-shardsvr.conf" ]; then
      cp /nfs/nosql/conf/epp-mongo-shardsvr.conf /nfs/nosql/conf/epp-mongo-shardsvr2.conf
      cp /nfs/nosql/conf/epp-mongo-shardsvr.conf /nfs/nosql/conf/epp-mongo-shardsvr3.conf
    fi
 
  03-perm.sh: |-
    #!/bin/bash
    # 1. 소유권 부여
    chown -R 2500:2500 /nfs/opt /nfs/permanent /nfs/nosql /nfs/database /nfs/var /nfs/tmp /nfs/home 2>/dev/null || true
    # 2. 일반 폴더 권한 (755)
    chmod -R 755 /nfs/opt /nfs/permanent /nfs/var /nfs/home 2>/dev/null || true
    chmod -R 777 /nfs/tmp /nfs/opt/ahnlab/cpp/log 2>/dev/null || true
    # 🚀 3. DB 전용 엄격한 권한 부여 (만약 777이면 DB가 즉시 자폭함!)
    chmod -R 700 /nfs/database 2>/dev/null || true
    chmod -R 700 /nfs/nosql 2>/dev/null || true
    # 🚀 4. 몽고DB 키파일은 무조건 400이어야 구동됨
    if ls /nfs/nosql/conf/mongo_key* 1> /dev/null 2>&1; then
      chmod 400 /nfs/nosql/conf/mongo_key*
    fi
    # 5. 특수 보안 파일 권한
    chmod 440 /nfs/etc/sudoers 2>/dev/null || true
    chmod 440 /nfs/etc/login.defs 2>/dev/null || true
