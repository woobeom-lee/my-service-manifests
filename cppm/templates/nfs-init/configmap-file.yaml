apiVersion: v1
kind: ConfigMap
metadata:
  name: nfs-init-file-cm
data:
  init.sh: |-
    #!/bin/bash
    echo "==== Starting On-Premise NFS Initialization ===="
    # 1. 완벽한 압축 해제 스킵 조건
    if [ -f "/nfs/bin/setting/install_link.sh" ] || [ -f "/nfs/ahnfs/bin/setting/install_link.sh" ]; then
      echo "[SKIP] Core files are already extracted."
    else
      echo "[RUN] Extracting setup files from /tools..."
      if [ -f "/tools/cpp_setup.tar" ]; then
        # 1-1. 이중 압축 해제를 위한 임시 작업 공간 생성
        mkdir -p /tmp/setup_extract
        echo "Extracting cpp_setup.tar to temp directory..."
        tar -xf /tools/cpp_setup.tar -C /tmp/setup_extract/
        # 1-2. 풀려난 파일들 중에서 ahnfs.tar.gz 찾기
        AHNFS_TAR=$(find /tmp/setup_extract -name "ahnfs.tar.gz" | head -n 1)
        if [ -n "$AHNFS_TAR" ]; then
          echo "Found $AHNFS_TAR ! Extracting to /nfs..."
          tar -zxvf "$AHNFS_TAR" -C /nfs/
        else
          echo "[ERROR] ahnfs.tar.gz not found inside cpp_setup.tar!"
          exit 1
        fi
        # 1-3. 임시 작업 공간 청소
        rm -rf /tmp/setup_extract
      elif [ -f "/tools/ahnfs.tar.gz" ]; then
        tar -zxvf /tools/ahnfs.tar.gz -C /nfs/
      else
        echo "[ERROR] Setup tar file not found in /tools directory!"
        exit 1
      fi
    fi
 
    # 2. 이중 폴더(ahnfs/ahnfs) 정리
    if [ -d "/nfs/ahnfs" ]; then
      echo "Cleaning up nested ahnfs directory..."
      mv /nfs/ahnfs/* /nfs/
      rm -rf /nfs/ahnfs
    fi
 
    # 3. K8s 마운트 에러(not a directory) 완벽 방어 로직
    echo "Verifying and fixing mount files..."
    mkdir -p /nfs/etc
    mkdir -p /nfs/permanent/clair/sql
    mkdir -p /nfs/permanent/clair/config
 
    FILES=(
      "/nfs/etc/sudoers"
      "/nfs/etc/login.defs"
      "/nfs/etc/crontab"
      "/nfs/permanent/clair/sql/clair2x-vuln-db.sql"
      "/nfs/permanent/clair/config/config.yaml"
    )
 
    for file in "${FILES[@]}"; do
      if [ -d "$file" ]; then
        rm -rf "$file"
      fi
      touch "$file"
    done
 
    # 4. 넉넉한 기본 권한 부여
    chmod -R 777 /nfs
    # 5. PostgreSQL 보안 권한 예외 처리
    echo "Applying strict permissions (700) for PostgreSQL..."
    find /nfs -type d -name "cppoltpdata" -exec chmod 700 {} \;
 
    echo "==== NFS Initialization Completed Successfully! ===="
