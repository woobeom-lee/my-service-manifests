apiVersion: apps/v1
kind: Deployment
metadata:
  name: tomcat-console
  namespace: {{ .Release.Namespace }}
  labels:
    app: tomcat-console
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: tomcat-console
  template:
    metadata:
      labels:
        app: tomcat-console
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      hostname: cpp-tomcat-console
      hostAliases:
        - ip: "10.128.88.28"
          hostnames:
            - "epp-postgres-eppoltp"
            - "epp-mgr"
            - "cpp-tomcat-auth"
            - "cpp-tomcat-console"
            - "host.docker.internal"
      nodeSelector:
        kubernetes.io/hostname: "cpp-server"
      tolerations:
        - operator: "Exists"
          effect: "NoSchedule"
      initContainers:
        - name: init-link
          image: "{{ .Values.global.imageRegistry }}/cpp-platform:{{ .Values.global.imageTag }}"
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsUser: 0
            privileged: true
          command:
            - "/bin/bash"
            - "-c"
            - |
              echo "Starting AhnLab setup..."
              bash /opt/ahnlab/cpp/bin/setting/install_link.sh || true
              echo "Fixing permissions for ALL 22 mounted paths..."
              mkdir -p /opt/repo /new /permanent /nosql /database /tmp /var/log /home /var/run/postgresql
              chown -R 2500:2500 /opt/ahnlab /permanent /nosql /tmp /var/log /home /opt/repo /new || true
          volumeMounts:
            - name: vol-docker-sock
              mountPath: /var/run/docker.sock
            {{- include "cppm.commonVolumeMounts" . | nindent 12 }}
      containers:
        - name: tomcat-console
          image: "{{ .Values.global.imageRegistry }}/cpp-platform:{{ .Values.global.imageTag }}"
          imagePullPolicy: IfNotPresent
          command: ["/bin/bash", "/opt/ahnlab/cpp/cmd/epp-tomcat-console.sh"]
          securityContext:
            runAsUser: 0
            privileged: true
          resources:
            requests:
              memory: "256Mi"
            limits:
              memory: "1024Mi"
          ports:
            - containerPort: 8806
          env:
            - name: REDIS_PASSWORD
              value: "qwe123"
            - name: TZ
              value: "Asia/Seoul"
            - name: CONTAINER_NAME
              value: "cpp-tomcat-console"
            - name: DOCKER_HOST
              value: "unix:///var/run/docker.sock"
            - name: JAVA_TOOL_OPTIONS
              value: "-Xms256m -Xmx768m -Dfile.encoding=UTF-8 -Depp.storage.path=/permanent -Depp.home=/opt/ahnlab/cpp -Depp.security.key.path=/permanent/etc/config/site.key -Dahnlab.epp.security.skip=true"
          volumeMounts:
            - name: vol-docker-sock
              mountPath: /var/run/docker.sock
            {{- include "cppm.commonVolumeMounts" . | nindent 12 }}
      volumes:
        - name: vol-docker-sock
          hostPath:
            path: /var/run/docker.sock
            type: Socket
        {{- include "cppm.commonVolumes" . | nindent 8 }}
---
apiVersion: v1
kind: Service
metadata:
  name: tomcat-console
  namespace: {{ .Release.Namespace }}
spec:
  ports:
    - port: 8806
      targetPort: 8806
  selector:
    app: tomcat-console
