apiVersion: apps/v1

kind: Deployment

metadata:

  name: tomcat-console

  namespace: {{ .Release.Namespace }}

  labels:

    app: tomcat-console

spec:

  replicas: 1

  strategy:

    type: Recreate

  selector:

    matchLabels:

      app: tomcat-console

  template:

    metadata:

      labels:

        app: tomcat-console

    spec:

      hostNetwork: true

      dnsPolicy: ClusterFirstWithHostNet

      hostname: cpp-tomcat-console

      # 🔥 [핵심 추가] 컨테이너 내부에서 다른 애플리케이션의 호스트명을 찾을 수 있도록 강제 매핑

      hostAliases:

        - ip: "10.128.88.28"

          hostnames:

            - "epp-postgres-eppoltp"
            - "epp-mgr"
            - "cpp-tomcat-auth"
            - "cpp-tomcat-console"
 
      nodeSelector:

        kubernetes.io/hostname: "cpp-server"

      tolerations:

        - operator: "Exists"

          effect: "NoSchedule"


      initContainers:
        - name: init-link

          image: "{{ .Values.global.imageRegistry }}/cpp-platform:{{ .Values.global.imageTag }}"

          imagePullPolicy: IfNotPresent

          securityContext:

            runAsUser: 0

            privileged: true

          command:

            - "/bin/bash"

            - "-c"

            - |

              echo "Checking Postgres DB connectivity on host port 8817..."

              until true || timeout 1 bash -c "</dev/tcp/127.0.0.1/8817" 2>/dev/null; do

                echo "Database is not ready yet, waiting 3 seconds..."

                sleep 3

              done

              echo "Database connected successfully! Starting AhnLab setup..."

              bash /opt/ahnlab/cpp/bin/setting/install_link.sh || true

              echo "Fixing permissions for ALL 22 mounted paths..."

              mkdir -p /opt/repo /new /permanent /nosql /database /tmp /var/log /home /var/run/postgresql

              chown -R 2500:2500 /opt/ahnlab /permanent /nosql /database /tmp /var/log /home /opt/repo /new /var/run/postgresql || true

          volumeMounts:

            - name: tmpfs-ahnlab

              mountPath: /opt/ahnlab

            - name: vol-ahnfs-root

              mountPath: /opt/ahnlab/cpp

              subPath: opt/ahnlab/cpp

            - name: vol-ahnfs-root

              mountPath: /opt/ahnlab/ems

              subPath: opt/ahnlab/ems

            - name: vol-ahnfs-root

              mountPath: /nosql

              subPath: nosql

            - name: vol-ahnfs-root

              mountPath: /database

              subPath: database

            - name: vol-ahnfs-root

              mountPath: /tmp

              subPath: tmp

            - name: vol-ahnfs-root

              mountPath: /home

              subPath: home

            - name: vol-ahnfs-root

              mountPath: /var/log

              subPath: var/log

            - name: vol-ahnfs-root

              mountPath: /var/run/postgresql

              subPath: var/run/postgresql

            - name: vol-ahnfs-root

              mountPath: /opt/repo

              subPath: external/repo

            - name: vol-ahnfs-root

              mountPath: /opt/ahnlab/install

              subPath: external/install

            - name: vol-ahnfs-root

              mountPath: /opt/ahnlab/update

              subPath: external/update

            - name: vol-ahnfs-root

              mountPath: /permanent

              subPath: permanent

            - name: vol-ahnfs-root

              mountPath: /new

              subPath: external/new

            - name: vol-host-log

              mountPath: /var/host_log

      containers:

        - name: tomcat-console

          image: "{{ .Values.global.imageRegistry }}/cpp-platform:{{ .Values.global.imageTag }}"

          imagePullPolicy: IfNotPresent

          command: ["/bin/bash", "/opt/ahnlab/cpp/cmd/epp-tomcat-console.sh"]

          securityContext:

            runAsUser: 0

            privileged: true

          # 🔥 [핵심 수정] 톰캣이 512Mi 제한에 걸려 터지지 않도록 힙 메모리를 컨테이너 한도 내로 최적화 맞춤

          resources:

            requests:

              memory: "256Mi"

            limits:

              memory: "1024Mi"

          ports:

            - containerPort: 8806

          env:

            - name: TZ

              value: "Asia/Seoul"

            - name: CONTAINER_NAME

              value: "cpp-tomcat-console"

            - name: DOCKER_HOST

              value: "unix:///var/run/docker.sock"

            - name: JAVA_TOOL_OPTIONS

              value: "-Xms256m -Xmx768m -Dfile.encoding=UTF-8 -Dlogging.config=file:///permanent/etc/config/log4j2.xml -Dlog4j2.configurationFile=file:///permanent/etc/config/log4j2.xml   -Depp.storage.path=/permanent -Depp.home=/opt/ahnlab/cpp -Depp.security.key.path=/permanent/etc/config/site.key -Dahnlab.epp.security.skip=true  "

          volumeMounts:

            - name: vol-docker-sock

              mountPath: /var/run/docker.sock

            - name: tmpfs-ahnlab

              mountPath: /opt/ahnlab

            - name: vol-ahnfs-root

              mountPath: /opt/ahnlab/cpp

              subPath: opt/ahnlab/cpp

            - name: vol-ahnfs-root

              mountPath: /opt/ahnlab/ems

              subPath: opt/ahnlab/ems

            - name: vol-ahnfs-root

              mountPath: /nosql

              subPath: nosql

            - name: vol-ahnfs-root

              mountPath: /database

              subPath: database

            - name: vol-ahnfs-root

              mountPath: /tmp

              subPath: tmp

            - name: vol-ahnfs-root

              mountPath: /home

              subPath: home

            - name: vol-ahnfs-root

              mountPath: /var/log

              subPath: var/log

            - name: vol-ahnfs-root

              mountPath: /var/run/postgresql

              subPath: var/run/postgresql

            - name: vol-ahnfs-root

              mountPath: /permanent

              subPath: permanent

            - name: vol-host-log

              mountPath: /var/host_log

      volumes:

        - name: vol-docker-sock

          hostPath:

            path: /var/run/docker.sock

            type: Socket

        - name: tmpfs-ahnlab

          emptyDir:

            medium: Memory

            sizeLimit: 16Mi

        - name: vol-ahnfs-root

          hostPath:

            path: {{ .Values.global.hostPathBase }}

            type: Directory

        - name: vol-host-log

          hostPath:

            path: /var/log

            type: Directory

---

apiVersion: v1

kind: Service

metadata:

  name: tomcat-console

  namespace: {{ .Release.Namespace }}

spec:

  ports:

    - port: 8806

      targetPort: 8806

  selector:

    app: tomcat-console
 
