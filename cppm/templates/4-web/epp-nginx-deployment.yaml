apiVersion: apps/v1
kind: Deployment
metadata:
  name: epp-nginx
  namespace: {{ .Release.Namespace }}
  labels:
    app: epp-nginx
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: epp-nginx
  template:
    metadata:
      labels:
        app: epp-nginx
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      hostname: cpp-nginx
      nodeSelector:
        kubernetes.io/hostname: "cpp-server"
      tolerations:
        - operator: "Exists"
          effect: "NoSchedule"
      hostAliases:
        - ip: "10.128.88.28"
          hostnames:
            - "host.docker.internal"
            - "epp-postgres-eppoltp"
            - "epp-redis"
            - "epp-mongo-mongos"
            - "epp-mgr"
            - "cpp-mongo-configsvr1"
            - "cpp-mongo-configsvr2"
            - "cpp-mongo-configsvr3"
            - "cpp-tomcat-auth"
            - "cpp-tomcat-console"
 
      initContainers:
        - name: init-link
          image: "{{ .Values.global.imageRegistry }}/cpp-platform:{{ .Values.global.imageTag }}"
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsUser: 0
            privileged: true
          command: 
            - "/bin/bash"
            - "-c"
            - |
              echo "Checking Postgres DB connectivity on host port 8817..."
              until true || timeout 1 bash -c "</dev/tcp/127.0.0.1/8817" 2>/dev/null; do
                echo "Database is not ready yet, waiting 3 seconds..."
                sleep 3
              done
              echo "Database connected successfully! Starting AhnLab setup..."
              bash /opt/ahnlab/cpp/bin/setting/install_link.sh || true
              echo "Fixing permissions for Nginx mounted paths..."
              mkdir -p /opt/repo /new /permanent /nosql /database /tmp /var/log /home /var/run/postgresql
              chown -R 2500:2500 /opt/ahnlab /permanent /nosql /database /tmp /var/log /home /opt/repo /new /var/run/postgresql || true
          volumeMounts:
            - name: tmpfs-ahnlab
              mountPath: /opt/ahnlab
            - name: vol-ahnfs-root
              mountPath: /opt/ahnlab/cpp
              subPath: opt/ahnlab/cpp
            - name: vol-ahnfs-root
              mountPath: /opt/ahnlab/ems
              subPath: opt/ahnlab/ems
            # 🚀 [대교정] initContainers에 유실되어 에러를 뿜던 /permanent 볼륨 통로를 확실하게 연결합니다!
            - name: vol-ahnfs-root
              mountPath: /permanent
              subPath: permanent
            - name: vol-ahnfs-root
              mountPath: /nosql
              subPath: nosql
            - name: vol-ahnfs-root
              mountPath: /database
              subPath: database
            - name: vol-ahnfs-root
              mountPath: /tmp
              subPath: tmp
            - name: vol-ahnfs-root
              mountPath: /home
              subPath: home
 
      containers:
        - name: epp-nginx
          image: docker.io/library/cpp-nginx:1.28.2-1
          imagePullPolicy: IfNotPresent
          command: ["nginx", "-g", "daemon off;"]
          securityContext:
            runAsUser: 0
            privileged: true
          resources:
            requests:
              memory: "256Mi"
            limits:
              memory: "1Gi"
          ports:
            - containerPort: 8809
            - containerPort: 8810
          env:
            - name: TZ
              value: "Asia/Seoul"
            - name: CONTAINER_NAME
              value: "cpp-nginx"
            - name: DOCKER_HOST
              value: "unix:///var/run/docker.sock"
          volumeMounts:
            - name: vol-docker-sock
              mountPath: /var/run/docker.sock
            - name: tmpfs-ahnlab
              mountPath: /opt/ahnlab
            - name: vol-ahnfs-root
              mountPath: /opt/ahnlab/cpp
              subPath: opt/ahnlab/cpp
            - name: vol-ahnfs-root
              mountPath: /opt/ahnlab/ems
              subPath: opt/ahnlab/ems
            - name: vol-ahnfs-root
              mountPath: /nosql
              subPath: nosql
            - name: vol-ahnfs-root
              mountPath: /database
              subPath: database
            - name: vol-ahnfs-root
              mountPath: /tmp
              subPath: tmp
            - name: vol-ahnfs-root
              mountPath: /home
              subPath: home
            - name: vol-ahnfs-root
              mountPath: /etc/sudoers
              subPath: etc/sudoers
            - name: vol-ahnfs-root
              mountPath: /etc/login.defs
              subPath: etc/login.defs
            - name: vol-ahnfs-root
              mountPath: /etc/cron.d
              subPath: etc/cron.d
            - name: vol-ahnfs-root
              mountPath: /etc/cron.daily
              subPath: etc/cron.daily
            - name: vol-ahnfs-root
              mountPath: /etc/crontab
              subPath: etc/crontab
            - name: vol-ahnfs-root
              mountPath: /etc/logrotate.d
              subPath: etc/logrotate.d
            - name: vol-ahnfs-root
              mountPath: /etc/rsyslog.d
              subPath: etc/rsyslog.d
            - name: vol-ahnfs-root
              mountPath: /var/log
              subPath: var/log
            - name: vol-ahnfs-root
              mountPath: /var/run/postgresql
              subPath: var/run/postgresql
            - name: vol-ahnfs-root
              mountPath: /opt/repo
              subPath: external/repo
            - name: vol-ahnfs-root
              mountPath: /opt/ahnlab/install
              subPath: external/install
            - name: vol-ahnfs-root
              mountPath: /opt/ahnlab/update
              subPath: external/update
            - name: vol-ahnfs-root
              mountPath: /permanent
              subPath: permanent
            - name: vol-ahnfs-root
              mountPath: /new
              subPath: external/new
            - name: vol-ahnfs-root
              mountPath: /etc/nginx/nginx.conf
              subPath: permanent/etc/nginx/nginx.conf
            - name: vol-host-log
              mountPath: /var/host_log
 
      # 🎯 헬름 수선 및 볼륨 트리 정렬 동기화 완료
      volumes:
        - name: vol-docker-sock
          hostPath:
            path: /var/run/docker.sock
            type: Socket
        - name: tmpfs-ahnlab
          emptyDir:
            medium: Memory
            sizeLimit: 16Mi
        - name: vol-ahnfs-root
          hostPath:
            path: {{ .Values.global.hostPathBase }}
            type: Directory
        - name: vol-host-log
          hostPath:
            path: /var/log
            type: Directory
 
---
 
apiVersion: v1
kind: Service
metadata:
  name: epp-nginx
  namespace: {{ .Release.Namespace }}
spec:
  ports:
    - name: https-auth
      port: 8809
      targetPort: 8809
    - name: http-console
      port: 8810
      targetPort: 8810
  selector:
    app: epp-nginx
