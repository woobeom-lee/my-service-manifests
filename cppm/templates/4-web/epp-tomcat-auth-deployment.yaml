apiVersion: apps/v1
kind: Deployment
metadata:
  name: epp-tomcat-auth
  namespace: {{ .Release.Namespace }}
  labels:
    app: epp-tomcat-auth
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: epp-tomcat-auth
  template:
    metadata:
      labels:
        app: epp-tomcat-auth
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      hostname: cpp-tomcat-auth
      nodeSelector:
        kubernetes.io/hostname: {{ .Values.global.nodeName | quote }}
      tolerations:
        - operator: "Exists"
          effect: "NoSchedule"
      hostAliases:
        - ip: {{ .Values.global.masterIp | quote }}
          hostnames:
            - "epp-pgbouncer-eppoltp"
            - "epp-postgres-eppoltp"
            - "cpp-server"
            - "epp-mgr"
            - "cpp-tomcat-auth"
            - "cpp-tomcat-console"
            - "cpp-tomcat-agent"
            - "host.docker.internal"
      initContainers:
        - name: init-link
          image: "{{ .Values.global.imageRegistry }}/cpp-platform:{{ .Values.global.imageTag }}"
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsUser: 0
            privileged: true
          command:
            - "/bin/bash"
            - "-c"
            - |
              echo "Starting AhnLab setup..."
              bash /opt/ahnlab/cpp/bin/setting/install_link.sh || true
              echo "Fixing permissions for AuthSvr mounted paths..."
              mkdir -p /opt/repo /new /permanent /nosql /database /tmp /var/log /home /var/run/postgresql
              chown -R 2500:2500 /opt/ahnlab /permanent /nosql /tmp /var/log /home /opt/repo /new || true
          volumeMounts:
            - name: vol-docker-sock
              mountPath: /var/run/docker.sock
            {{- include "cppm.commonVolumeMounts" . | nindent 12 }}
      containers:
        - name: epp-tomcat-auth
          image: "{{ .Values.global.imageRegistry }}/cpp-platform:{{ .Values.global.imageTag }}"
          imagePullPolicy: IfNotPresent
          command: ["/bin/bash", "/opt/ahnlab/cpp/cmd/epp-tomcat-auth.sh"]
          securityContext:
            runAsUser: 0
            privileged: true
          resources:
            requests:
              memory: "512Mi"
            limits:
              memory: "1536Mi"
          ports:
            - containerPort: 8808
          env:
            - name: REDIS_PASSWORD
              value: "qwe123"
            - name: TZ
              value: "Asia/Seoul"
            - name: CONTAINER_NAME
              value: "cpp-tomcat-auth"
            - name: DOCKER_HOST
              value: "unix:///var/run/docker.sock"
            - name: JAVA_TOOL_OPTIONS
              value: "-Xms512m -Xmx1024m -Dfile.encoding=UTF-8 -Depp.storage.path=/permanent -Depp.home=/opt/ahnlab/cpp -Depp.security.key.path=/permanent/etc/config/site.key -Dahnlab.epp.security.skip=true"
          volumeMounts:
            - name: vol-docker-sock
              mountPath: /var/run/docker.sock
            {{- include "cppm.commonVolumeMounts" . | nindent 12 }}
      volumes:
        - name: vol-docker-sock
          hostPath:
            path: /var/run/docker.sock
            type: Socket
        {{- include "cppm.commonVolumes" . | nindent 8 }}
---
apiVersion: v1
kind: Service
metadata:
  name: epp-tomcat-auth
  namespace: {{ .Release.Namespace }}
spec:
  ports:
    - port: 8808
      targetPort: 8808
  selector:
    app: epp-tomcat-auth
