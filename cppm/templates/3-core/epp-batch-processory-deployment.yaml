apiVersion: apps/v1
kind: Deployment
metadata:
  name: epp-batch-processor
  # 1. 네임스페이스 하드코딩 제거 (Helm이 알아서 주입)
  namespace: {{ .Release.Namespace }}
  labels:
    app: epp-batch-processor
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: epp-batch-processor
  template:
    metadata:
      labels:
        app: epp-batch-processor
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      hostname: cpp-batch-processor
      nodeSelector:
        kubernetes.io/hostname: "cpp-server"
      tolerations:
        - operator: "Exists"
          effect: "NoSchedule"
      # 2. hostAliases는 기존 스크립트 호환성을 위해 당분간 살려둡니다.
      hostAliases:
        - ip: "10.128.88.28"
          hostnames:
            - "epp-kafka"
            - "cpp-kafka"
            - "epp-postgres-eppoltp"
            - "epp-pgbouncer-eppoltp"
            - "cpp-pgbouncer-eppoltp"
            - "epp-redis"
            - "epp-mongo-mongos"
            - "epp-mgr"
            - "cpp-mongo-configsvr1"
            - "cpp-mongo-configsvr2"
            - "cpp-mongo-configsvr3"
            - "cpp-tomcat-auth"
            - "cpp-tomcat-console"
            - "host.docker.internal"
            - "cpp-nginx"
            - "cpp-kafka-consumer"
            - "cpp-scheduler"
 
      initContainers:
        # 3. 우리가 만든 '마법의 공통 정찰병(DB/Kafka 대기)' 추가!
        {{- include "cppm.wait-for-dependencies" . | nindent 8 }}
        # 4. 기존에 있던 init-link 정찰병은 폴더 권한(chown)을 줘야 하므로 대기 로직 뒤에 이어서 실행되게 둡니다.
        - name: init-link
          # 5. 이미지 하드코딩 제거 -> values.yaml 변수로 치환!
          image: "{{ .Values.global.imageRegistry }}/cpp-platform:{{ .Values.global.imageTag }}"
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsUser: 0
            privileged: true
          command:
            - "/bin/bash"
            - "-c"
            - |
              echo "Starting AhnLab setup..."
              bash /opt/ahnlab/cpp/bin/setting/install_link.sh || true
              echo "Fixing permissions for BatchProcessor mounted paths..."
              mkdir -p /opt/repo /new /permanent /nosql /database /tmp /var/log /home /var/run/postgresql
              chown -R 2500:2500 /opt/ahnlab /permanent /nosql /database /tmp /var/log /home /opt/repo /new /var/run/postgresql || true
 
      containers:
        - name: epp-batch-processor
          # 5. 메인 앱 이미지 하드코딩 제거 -> values.yaml 변수로 치환!
          image: "{{ .Values.global.imageRegistry }}/cpp-platform:{{ .Values.global.imageTag }}"
          imagePullPolicy: IfNotPresent
          command: ["/bin/bash", "/opt/ahnlab/cpp/cmd/epp-batch-processor.sh"]
          securityContext:
            runAsUser: 0
            privileged: true
          resources:
            requests:
              memory: "256Mi"
            limits:
              memory: "512Mi"
          env:
            - name: TZ
              value: "Asia/Seoul"
            - name: CONTAINER_NAME
              value: "cpp-batch-processor"
            - name: DOCKER_HOST
              value: "unix:///var/run/docker.sock"
            - name: JAVA_TOOL_OPTIONS
              value: "-Xms512m -Xmx1024m -Dfile.encoding=UTF-8 -Dlogging.config=file:///permanent/etc/config/log4j2.xml -Dlog4j2.configurationFile=file:///permanent/etc/config/log4j2.xml   -Depp.storage.path=/permanent -Depp.home=/opt/ahnlab/cpp -Depp.security.key.path=/permanent/etc/config/site.key -Dahnlab.epp.security.skip=true  "
          # 볼륨 마운트는 기존 설정을 완벽하게 유지합니다.
          volumeMounts:
            - name: vol-docker-sock
              mountPath: /var/run/docker.sock
            - name: tmpfs-ahnlab
              mountPath: /opt/ahnlab
            - name: vol-ahnfs-root
              mountPath: /opt/ahnlab/cpp
              subPath: opt/ahnlab/cpp
            - name: vol-ahnfs-root
              mountPath: /opt/ahnlab/ems
              subPath: opt/ahnlab/ems
            - name: vol-ahnfs-root
              mountPath: /nosql
              subPath: nosql
            - name: vol-ahnfs-root
              mountPath: /database
              subPath: database
            - name: vol-ahnfs-root
              mountPath: /tmp
              subPath: tmp
            - name: vol-ahnfs-root
              mountPath: /home
              subPath: home
            - name: vol-ahnfs-root
              mountPath: /etc/fstab
              subPath: etc/fstab
            - name: vol-ahnfs-root
              mountPath: /etc/sudoers
              subPath: etc/sudoers
            - name: vol-ahnfs-root
              mountPath: /etc/login.defs
              subPath: etc/login.defs
            - name: vol-ahnfs-root
              mountPath: /etc/cron.d
              subPath: etc/cron.d
            - name: vol-ahnfs-root
              mountPath: /etc/cron.daily
              subPath: etc/cron.daily
            - name: vol-ahnfs-root
              mountPath: /etc/crontab
              subPath: etc/crontab
            - name: vol-ahnfs-root
              mountPath: /etc/logrotate.d
              subPath: etc/logrotate.d
            - name: vol-ahnfs-root
              mountPath: /etc/rsyslog.d
              subPath: etc/rsyslog.d
            - name: vol-ahnfs-root
              mountPath: /var/log
              subPath: var/log
            - name: vol-ahnfs-root
              mountPath: /var/run/postgresql
              subPath: var/run/postgresql
            - name: vol-ahnfs-root
              mountPath: /opt/repo
              subPath: external/repo
            - name: vol-ahnfs-root
              mountPath: /opt/ahnlab/install
              subPath: external/install
            - name: vol-ahnfs-root
              mountPath: /opt/ahnlab/update
              subPath: external/update
            - name: vol-ahnfs-root
              mountPath: /permanent
              subPath: permanent
            - name: vol-ahnfs-root
              mountPath: /new
              subPath: external/new
            - name: vol-host-log
              mountPath: /var/host_log
      volumes:
        - name: vol-docker-sock
          hostPath:
            path: /var/run/docker.sock
            type: Socket
        - name: tmpfs-ahnlab
          emptyDir:
            medium: Memory
            sizeLimit: 16Mi
        - name: vol-ahnfs-root
          hostPath:
            path: {{ .Values.global.hostPathBase }}
            type: Directory
        - name: vol-host-log
          hostPath:
            path: /var/log
            type: Directory
