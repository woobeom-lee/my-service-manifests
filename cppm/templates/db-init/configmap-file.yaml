data:
  init.sh: |-
    #!/bin/bash
    echo "==== Starting On-Premise DB Initialization ===="
    # 설치형 스크립트가 확보되기 전까지 CSAP 전용 DB 초기화 로직 우회
    echo "Bypassing CSAP specific DB schema scripts..."
    # (추후 실제 DB 스키마 쿼리가 필요해지면 여기에 작성)
    echo "==== DB Initialization Completed Successfully! ===="
