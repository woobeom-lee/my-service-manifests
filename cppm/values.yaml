# ==============================================================================
# 🚀 AhnLab CPPM K8s - Global & Database Values
# ==============================================================================
 
global:
  imageRegistry: "ghcr.io/woobeom-lee"
  imageTag: "9-16-25"
  nodeName: "cpp-server"
  # 🎯 [긴급 처방] 1-database 파일들이 찾고 있을 만한 변수들을 모두 융단폭격으로 넣습니다!
  hostPathBase: "/home/k8s/cpp_installer/ahnfs"
  hostPath: "/home/k8s/cpp_installer/ahnfs"
  volumePath: "/home/k8s/cpp_installer/ahnfs"
  hostIp: "10.128.88.28"
  serverIp: "10.128.88.28"
  ip: "10.128.88.28"
 
# ==============================================================================
# Database 
# ==============================================================================
database:
  clairDb:
    replicas: 1
    image:
      repository: "clair-db"
      tag: "latest"
      pullPolicy: "IfNotPresent"
  pgbouncer:
    replicas: 1
  postgres:
    replicas: 1
  redis:
    replicas: 1
  mongo:
    mongos:
      replicas: 1
    configsvr1:
      replicas: 1
    configsvr2:
      replicas: 1
    configsvr3:
      replicas: 1
    shardsvr1:
      replicas: 1
    shardsvr2:
      replicas: 1
    shardsvr3:
      replicas: 1
