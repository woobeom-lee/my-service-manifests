# ==============================================================================
# 🚀 AhnLab CPPM K8s - Global & Database Values
# ==============================================================================
 
global:
  imageRegistry: "ghcr.io/woobeom-lee"
  imageTag: "9-16-25"
  hostPathBase: "/home/k8s/cpp_installer/ahnfs"
  nodeName: "cpp-server"
 
# ==============================================================================
# Database (1-database 파일들이 참조하는 레플리카 변수들)
# ==============================================================================
database:
  clairDb:
    replicas: 1
    image:
      repository: "clair-db"
      tag: "latest"
      pullPolicy: "IfNotPresent"
  pgbouncer:
    replicas: 1
  postgres:
    replicas: 1
  redis:
    replicas: 1
  mongo:
    mongos:
      replicas: 1
    configsvr1:
      replicas: 1
    configsvr2:
      replicas: 1
    configsvr3:
      replicas: 1
    shardsvr1:
      replicas: 1
    shardsvr2:
      replicas: 1
    shardsvr3:
      replicas: 1
